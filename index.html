<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SNBT LOGIKA FIGURAL – QUIZ HIMPUNAN</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;background:#000;font-family:Segoe UI,sans-serif;
  display:flex;justify-content:center;align-items:center;
  height:100vh;color:#fff;
}
.phone{
  width:360px;height:640px;background:#0b0b0b;
  border-radius:28px;overflow:hidden;position:relative;
}
.screen{position:absolute;inset:0;padding:14px;display:none;flex-direction:column}
.screen.active{display:flex}

/* HEADER */
.header{
  display:flex;justify-content:space-between;align-items:center;
  font-size:11px;opacity:.7
}
.qnum{font-weight:700}

/* HOOK */
.hook{
  margin:auto;text-align:center;
  font-size:20px;font-weight:900;
  animation:shake .1s 6 alternate,colorchange .2s infinite alternate
}
@keyframes shake{0%{transform:translateX(0)}50%{transform:translateX(-3px)}100%{transform:translateX(3px)}}
@keyframes colorchange{0%{color:#ff5555}50%{color:#55ff55}100%{color:#5555ff}}

/* SOAL */
.soal-container{
  margin-top:18px;
  display:flex;flex-direction:column;align-items:center;gap:14px
}
.himpunan-row{display:flex;align-items:center;gap:8px}
.operator{font-size:20px;font-weight:900;opacity:.8}

/* KOTAK */
.kotak{
  width:64px;height:64px;background:#1a1a1a;
  border:1.5px solid #fff;border-radius:6px;
  display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:3px
}
.kotak-empty{border-style:dashed;font-size:18px}

/* SHAPE */
.triangle-right{width:0;height:0;border-left:14px solid #fff;border-top:7px solid transparent;border-bottom:7px solid transparent}
.triangle-isosceles{width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-bottom:14px solid #fff}
.rectangle{width:14px;height:7px;background:#fff}
.rectangle-striped{width:14px;height:7px;background:repeating-linear-gradient(45deg,#fff 0 2px,transparent 2px 4px)}
.half-circle{width:14px;height:7px;background:#fff;border-radius:7px 7px 0 0}
.trapezoid{width:14px;height:0;border-bottom:14px solid #fff;border-left:4px solid transparent;border-right:4px solid transparent}
.parallelogram{width:14px;height:7px;background:#fff;transform:skew(20deg)}

/* OPSI A–D */
.opsi{
  margin-top:10px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  width:100%;
}
.option{
  display:flex;align-items:center;gap:6px;
  border:1px solid #444;border-radius:8px;
  padding:6px;
  opacity:0;transform:scale(.95);
  transition:.3s;
}
.option.show{opacity:1;transform:scale(1)}
.label{
  width:22px;height:22px;
  border-radius:50%;
  border:1px solid #fff;
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:700
}

/* OVERLAY */
.overlay{
  margin-top:8px;
  font-size:11px;opacity:0;transition:.3s;text-align:center
}
.overlay.show{opacity:1}
</style>
</head>
<body>

<div class="phone">

<!-- HOOK -->
<div class="screen active">
  <div class="hook">QUIZ SNBT<br>LOGIKA FIGURAL</div>
</div>

<!-- SOAL TEMPLATE (1–9 diputar ulang) -->
<div class="screen">
  <div class="header">
    <div class="qnum">SOAL <span id="qno">1</span> / 9</div>
    <div>HIMPUNAN</div>
  </div>

  <div class="soal-container">
    <div class="himpunan-row">
      <div class="kotak">
        <div class="triangle-right"></div>
        <div class="rectangle"></div>
        <div class="rectangle-striped"></div>
      </div>
      <div class="operator">× 2 =</div>
      <div class="kotak kotak-empty">?</div>
    </div>

    <!-- OPSI A–D -->
    <div class="opsi">
      <div class="option">
        <div class="label">A</div>
        <div class="kotak">
          <div class="triangle-right"></div><div class="rectangle"></div><div class="rectangle-striped"></div>
          <div class="triangle-right"></div><div class="rectangle"></div><div class="rectangle-striped"></div>
        </div>
      </div>
      <div class="option">
        <div class="label">B</div>
        <div class="kotak"><div class="triangle-isosceles"></div></div>
      </div>
      <div class="option">
        <div class="label">C</div>
        <div class="kotak"><div class="rectangle"></div><div class="rectangle-striped"></div></div>
      </div>
      <div class="option">
        <div class="label">D</div>
        <div class="kotak"><div class="parallelogram"></div></div>
      </div>
    </div>
  </div>

  <div class="overlay">Perkalian = elemen digandakan</div>
</div>

</div>

<script>
const screens=[...document.querySelectorAll('.screen')];
const options=[...document.querySelectorAll('.option')];
const qno=document.getElementById('qno');
let idx=0, soal=1;

function show(n){screens.forEach((s,i)=>s.classList.toggle('active',i===n))}
function reset(){
  options.forEach(o=>o.classList.remove('show'));
  document.querySelector('.overlay').classList.remove('show');
}
function play(){
  show(idx);
  if(idx===0){setTimeout(()=>{idx=1;play()},1300);return}
  qno.textContent=soal;
  reset();
  setTimeout(()=>options.forEach((o,i)=>setTimeout(()=>o.classList.add('show'),120*i)),400);
  setTimeout(()=>document.querySelector('.overlay').classList.add('show'),1600);
  setTimeout(next,3400);
}
function next(){
  soal++; if(soal>9)soal=1;
  play();
}
play();
</script>

</body>
</html>
