<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">

<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  background:#020617;
  overflow:hidden;
  font-family:system-ui,Arial;
}

.stage{
  width:100vw;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

/* PHONE */
.phone{
  width:300px;
  height:540px;
  border-radius:38px;
  overflow:hidden;
  position:relative;
  box-shadow:0 60px 150px rgba(0,0,0,.85);
  animation:float 6s ease-in-out infinite;
}
@keyframes float{
  0%,100%{transform:rotateX(4deg) rotateY(-4deg)}
  50%{transform:rotateX(7deg) rotateY(-7deg)}
}

video{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  filter:brightness(.7);
}

/* OVERLAY */
.overlay{
  position:absolute;
  inset:0;
  padding:18px;
  box-sizing:border-box;
  background:rgba(2,6,23,.55);
  color:#fff;
  opacity:0;
  animation:scene 9.5s infinite;
}

/* SOAL */
.soal{
  font-family:'Anton',sans-serif;
  font-size:26px;
  line-height:1.35;
  letter-spacing:1px;
  animation:shake 1.2s ease-out;
}
@keyframes shake{
  0%{transform:translate(0)}
  20%{transform:translate(-2px,1px)}
  40%{transform:translate(2px,-1px)}
  60%{transform:translate(-1px,-1px)}
  100%{transform:translate(0)}
}

/* OPSI */
.opsi{
  margin-top:10px;
  padding:10px;
  border:1px solid #334155;
  border-radius:10px;
  font-size:14px;
}

/* RATIONALE */
.rationale{
  position:absolute;
  bottom:28px;
  left:18px;
  right:18px;
  font-size:13px;
  color:#fff;
  text-shadow:0 0 8px rgba(255,255,255,.5);
  opacity:0;
}

/* TIMELINE */
@keyframes scene{
  0%{opacity:0}
  10%{opacity:1}
  70%{opacity:1}
  85%{opacity:0}
  100%{opacity:0}
}

/* RATIONALE TIMING */
.overlay .rationale{
  animation:rat 9.5s infinite;
}
@keyframes rat{
  0%,55%{opacity:0}
  65%,80%{opacity:1}
  100%{opacity:0}
}
</style>
</head>

<body>
<div class="stage">
<div class="phone" style="background:#0f172a">
<video autoplay muted loop playsinline>
  <source src="demo.mp4" type="video/mp4">
</video>

<div class="overlay">
  <div class="soal">
    Jika 2x − 4 = 10,<br>
    maka x = …
  </div>
  <div class="opsi">A. 6</div>
  <div class="opsi">B. 7</div>
  <div class="opsi">C. 8</div>

  <div class="rationale">
    Tambah 4 → 2x = 14 → x = 7
  </div>
</div>

</div>
</div>
</body>
</html>
