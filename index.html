<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wrong → Correct Illusion</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{
  width:100%;height:100%;
  background:#000;
  font-family:Impact, Arial Black, sans-serif;
  color:#fff;
  overflow:hidden;
}

/* PHONE */
.wrap{width:100%;height:100%;display:flex;justify-content:center;align-items:center}
.phone{
  width:360px;height:640px;
  border-radius:36px;
  border:8px solid #111;
  position:relative;
  overflow:hidden;
}

/* SAFE */
.safe{
  position:absolute;
  top:70px;bottom:90px;
  left:20px;right:70px;
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
}

/* TEXT */
.level{font-size:13px;letter-spacing:3px;opacity:.6}
.hook{font-size:26px;margin-top:6px}
.small{font-size:13px;opacity:.8;margin-top:6px}
.danger{color:#ff2f2f;text-shadow:0 0 14px rgba(255,0,0,.55)}
.good{color:#4dff88;text-shadow:0 0 14px rgba(77,255,136,.5)}

/* FIGURAL */
.figural{
  margin-top:18px;
  display:grid;
  grid-template-columns:repeat(3,70px);
  grid-template-rows:repeat(3,70px);
  gap:8px;
}
.cell{
  border:2px solid #fff;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:26px;
  transition:all .6s ease;
}

/* ANSWER */
.answer{
  margin-top:14px;
  font-size:22px;
  opacity:0;
  transition:opacity .6s ease;
}
.answer.show{opacity:1}

/* UI */
.ui{
  position:absolute;
  right:10px;
  top:130px;
  font-size:14px;
}

/* COMMENT */
.comment{
  position:absolute;
  right:70px;
  top:260px;
  max-width:210px;
  padding:10px 12px;
  background:rgba(20,20,20,.96);
  border-radius:14px;
  font-size:13px;
  opacity:0;
}
@keyframes commentIn{
  from{transform:translateX(14px);opacity:0}
  to{transform:translateX(0);opacity:1}
}
@keyframes commentOut{
  from{opacity:1}
  to{opacity:0}
}
.comment-show{animation:commentIn .4s ease forwards}
.comment-hide{animation:commentOut .4s ease forwards}

.hidden{display:none}
</style>
</head>

<body>

<div class="wrap">
<div class="phone">

<!-- UI -->
<div class="ui">
  ❤️ 2.1K<br>
  💬 136<br>
  ↗ Share
</div>

<!-- COMMENT -->
<div id="comment" class="comment">
  “Aku yakin jawabanku barusan…”
</div>

<div class="safe">

<div class="level">LEVEL 15</div>
<div class="hook danger">HAMPIR SEMUA SALAH</div>
<div class="small danger">Termasuk yang merasa yakin</div>

<!-- FIGURAL -->
<div id="grid" class="figural">
  <div class="cell">▲</div><div class="cell">▲</div><div class="cell">▲</div>
  <div class="cell">●</div><div class="cell">●</div><div class="cell">●</div>
  <div class="cell">■</div><div class="cell">■</div><div class="cell">?</div>
</div>

<!-- WRONG ANSWER -->
<div id="wrong" class="answer danger">
  Jawaban: ■
</div>

<!-- CORRECT ANSWER -->
<div id="correct" class="answer good hidden">
  Jawaban yang tepat: ▲
</div>

<div id="cta" class="small hidden">
  Kalau kamu langsung tahu kenapa, level berikutnya cocok buatmu.
</div>

</div>
</div>
</div>

<script>
/* FRAME ILLUSION */
const frames=[
 ["▲","▲","▲","●","●","●","■","■","?"],
 ["▲","▲","▲","●","●","●","■","?","■"],
 ["▲","▲","▲","●","●","●","?","■","■"]
];
const cells=document.querySelectorAll(".cell");
let f=0;
setInterval(()=>{
  f=(f+1)%frames.length;
  frames[f].forEach((v,i)=>cells[i].textContent=v);
},2200);

/* WRONG ANSWER FIRST */
setTimeout(()=>{
  document.getElementById("wrong").classList.add("show");
},18000);

/* COMMENT */
const c=document.getElementById("comment");
setTimeout(()=>{
  c.classList.add("comment-show");
  setTimeout(()=>c.classList.add("comment-hide"),2600);
},21000);

/* CORRECTION */
setTimeout(()=>{
  document.getElementById("wrong").classList.remove("show");
  document.getElementById("correct").classList.remove("hidden");
  document.getElementById("correct").classList.add("show");
},34000);

/* CTA */
setTimeout(()=>{
  document.getElementById("cta").classList.remove("hidden");
},52000);
</script>

</body>
</html>
