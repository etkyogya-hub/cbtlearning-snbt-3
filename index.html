<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>CBT Pure Visual</title>

<style>
html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  background:#000;
  overflow:hidden;
}

/* STAGE */
.stage{
  position:relative;
  width:100vw;
  height:100vh;
  background:#000;
  overflow:hidden;
}

/* VIDEO */
video{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;

  /* micro life */
  transform:scale(1.06);
  animation:
    zoomBreath 6s ease-in-out infinite,
    flicker 3.2s linear infinite;
}

/* very slow zoom (algoritma-friendly) */
@keyframes zoomBreath{
  0%,100%{transform:scale(1.06)}
  50%{transform:scale(1)}
}

/* micro luminance change → frame variation */
@keyframes flicker{
  0%,100%{filter:brightness(1)}
  50%{filter:brightness(1.06)}
}

/* FLASH CUT – 0.2s pertama */
.flash{
  position:absolute;
  inset:0;
  background:#fff;
  opacity:0;
  animation:flashIn 6s infinite;
  pointer-events:none;
}

@keyframes flashIn{
  0%{opacity:.18}
  3%{opacity:0}
  100%{opacity:0}
}

/* CASCADE SHADOW (depth illusion) */
.shadow{
  position:absolute;
  inset:0;
  box-shadow:
    inset 0 0 120px rgba(0,0,0,.65),
    inset 0 0 220px rgba(0,0,0,.9);
  pointer-events:none;
}
</style>
</head>

<body>
<div class="stage">

  <video autoplay muted loop playsinline>
    <source src="SNBT+VO2.webm.mp4" type="video/mp4">
  </video>

  <!-- 2s first-frame stim -->
  <div class="flash"></div>

  <!-- depth -->
  <div class="shadow"></div>

</div>
</body>
</html>
