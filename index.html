<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0" />
<title>TikTok Reasoning Overlay</title>

<style>
/* ================= RESET ================= */
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  width: 100%;
  height: 100%;
  background: #000;
  overflow: hidden;
  font-family: 'Arial Black', Arial, sans-serif;
  color: #fff;
}

/* ================= CANVAS ================= */
#screen {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 6vw;
}

/* ================= TEXT STYLES ================= */
.hook {
  font-size: 8vw;
  font-weight: 900;
  letter-spacing: 0.04em;
}

.main {
  font-size: 5vw;
  line-height: 1.4;
}

.option {
  font-size: 4.5vw;
  margin-top: 1.2vw;
}

.small {
  font-size: 3.5vw;
  opacity: 0.85;
}

/* ================= ANIMATIONS ================= */
@keyframes zoomShock {
  0%   { transform: scale(0.6); opacity: 0; }
  60%  { transform: scale(1.1); opacity: 1; }
  100% { transform: scale(1); }
}

@keyframes microShake {
  0% { transform: translateX(0); }
  25% { transform: translateX(-2px); }
  50% { transform: translateX(2px); }
  75% { transform: translateX(-1px); }
  100% { transform: translateX(0); }
}

@keyframes flashDim {
  0% { opacity: 0.8; }
  100% { opacity: 1; }
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

/* ================= STATES ================= */
.hidden { display: none; }
.fade { animation: fadeIn 0.6s ease forwards; }
.shock { animation: zoomShock 0.4s ease-out forwards; }
.shake { animation: microShake 0.3s ease-in-out infinite; }
.flash { animation: flashDim 0.5s ease-in-out alternate 2; }

</style>
</head>
<body>

<div id="screen">

  <!-- ================= HOOK ================= -->
  <div id="hook" class="hook hidden">
    JANGAN JAWAB CEPAT
  </div>

  <!-- ================= MID WARNING ================= -->
  <div id="warn1" class="small hidden" style="margin-top:6vw;">
    ⚠️ 83% SALAH DI BAGIAN INI
  </div>

  <!-- ================= QUESTION ================= -->
  <div id="question" class="main hidden" style="margin-top:6vw;">
    <!-- EDIT SOAL DI SINI -->
    Perhatikan pola berikut.  
    Kesimpulan yang PALING TEPAT adalah?
  </div>

  <!-- ================= OPTIONS ================= -->
  <div id="options" class="hidden">
    <!-- EDIT OPSI DI SINI -->
    <div class="option">A. Pilihan pertama</div>
    <div class="option">B. Pilihan kedua</div>
    <div class="option">C. Pilihan ketiga</div>
    <div class="option">D. Pilihan keempat</div>
  </div>

  <!-- ================= MID PSYCHO ================= -->
  <div id="warn2" class="small hidden" style="margin-top:6vw;">
    Yang yakin justru sering keliru.
  </div>

  <!-- ================= FINAL ================= -->
  <div id="final" class="hook hidden" style="margin-top:6vw;">
    BACA PELAN. INI FINAL.
  </div>

  <!-- ================= CTA 1 ================= -->
  <div id="cta" class="small hidden" style="margin-top:3vw;">
    Kalau ini terasa mudah, cek level selanjutnya.
  </div>

</div>

<script>
/* ================= TIMELINE (detik) ================= */

setTimeout(() => {
  hook.classList.remove('hidden');
  hook.classList.add('shock', 'shake', 'flash');
}, 100);

setTimeout(() => {
  hook.classList.remove('shake');
}, 2000);

setTimeout(() => {
  question.classList.remove('hidden');
  question.classList.add('fade');
}, 4000);

setTimeout(() => {
  warn1.classList.remove('hidden');
  warn1.classList.add('fade');
}, 10000);

setTimeout(() => {
  options.classList.remove('hidden');
  options.classList.add('fade');
}, 14000);

setTimeout(() => {
  warn2.classList.remove('hidden');
  warn2.classList.add('fade');
}, 22000);

setTimeout(() => {
  final.classList.remove('hidden');
  final.classList.add('shock');
}, 55000);

setTimeout(() => {
  cta.classList.remove('hidden');
  cta.classList.add('fade');
}, 58000);
</script>

</body>
</html>
