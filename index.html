<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CBT Figural Reasoning</title>

<style>
body{
  margin:0;
  background:#000;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  font-family:Arial, sans-serif;
  color:#fff;
}

.phone{
  width:360px;
  height:640px;
  border:8px solid #111;
  border-radius:30px;
  padding:24px;
  box-sizing:border-box;
}

.title{
  text-align:center;
  font-size:14px;
  letter-spacing:2px;
  opacity:.7;
}

.question{
  margin-top:12px;
  font-size:16px;
  text-align:center;
}

.grid{
  margin:24px auto;
  display:grid;
  grid-template-columns:repeat(3,80px);
  grid-template-rows:repeat(3,80px);
  gap:10px;
  justify-content:center;
}

.cell{
  border:2px solid #fff;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:28px;
}

.note{
  text-align:center;
  font-size:13px;
  opacity:.75;
}
</style>
</head>

<body>

<div class="phone">

  <div class="title">FIGURAL REASONING</div>

  <div class="question">
    Perhatikan pola berikut.  
    Bentuk apakah yang paling tepat menggantikan tanda tanya?
  </div>

  <div class="grid">
    <!-- BARIS 1 -->
    <div class="cell">▲</div>
    <div class="cell">▶</div>
    <div class="cell">▼</div>

    <!-- BARIS 2 -->
    <div class="cell">◀</div>
    <div class="cell">▲</div>
    <div class="cell">▶</div>

    <!-- BARIS 3 -->
    <div class="cell">▼</div>
    <div class="cell">◀</div>
    <div class="cell">?</div>
  </div>

  <div class="note">
    Setiap baris mengikuti aturan yang sama.
  </div>

</div>

</body>
</html>
