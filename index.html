<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>CBT Walkthrough — SNBT</title>

<style>
body{
  margin:0;
  height:100vh;
  background:#020617;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:system-ui;
}

/* ============ PHONE MOCKUP ============ */
.phone{
  width:240px;
  height:480px;
  border-radius:36px;
  background:#020617;
  box-shadow:0 40px 90px rgba(0,0,0,.8);
  position:relative;
}
.screen{
  position:absolute;
  inset:12px;
  border-radius:26px;
  background:#020617;
  padding:14px;
  color:#e5e7eb;
  font-size:13px;
  overflow:hidden;
}

/* ============ QUESTION ============ */
.question span{
  display:inline-block;
  opacity:0;
  transform:scale(.6);
  animation:wordIn .18s ease forwards;
}
@keyframes wordIn{
  to{opacity:1;transform:scale(1)}
}

/* ============ OPTIONS ============ */
.options li{
  list-style:none;
  margin:6px 0;
  padding:6px 8px;
  border:1px solid #334155;
  border-radius:8px;
  opacity:0;
  transform:translateY(6px);
  animation:optIn .25s ease forwards;
}
@keyframes optIn{
  to{opacity:1;transform:translateY(0)}
}

/* ============ CORRECT ============ */
.correct{
  border-color:#22c55e !important;
  background:rgba(34,197,94,.15);
}

/* ============ RATIONALE ============ */
.rationale{
  margin-top:10px;
  padding:8px;
  border-left:3px solid #38bdf8;
  font-size:12px;
  line-height:1.4;
  opacity:0;
  animation:fadeIn .4s ease forwards;
}
@keyframes fadeIn{
  to{opacity:1}
}
</style>
</head>

<body>

<div class="phone">
  <div class="screen">

    <div class="question" id="question">
      Jika 3x + 5 = 20, maka nilai x adalah
    </div>

    <ul class="options" id="options">
      <li>A. 3</li>
      <li>B. 4</li>
      <li>C. 5</li>
      <li>D. 6</li>
    </ul>

    <div class="rationale" id="rationale">
      Karena 3x = 15, maka x = 5.  
      Ini bentuk soal aljabar linear dasar SNBT.
    </div>

  </div>
</div>

<script>
/* ===== SPLIT QUESTION ===== */
const q=document.getElementById("question");
const words=q.innerText.split(" ");
q.innerHTML="";
words.forEach((w,i)=>{
  const s=document.createElement("span");
  s.innerText=w+" ";
  s.style.animationDelay=(i*0.06)+"s";
  q.appendChild(s);
});

/* ===== OPTIONS TIMING ===== */
const opts=document.querySelectorAll(".options li");
opts.forEach((li,i)=>{
  li.style.animationDelay=(1.2+i*0.25)+"s";
});

/* ===== HIGHLIGHT ANSWER ===== */
setTimeout(()=>{
  opts[2].classList.add("correct");
},2800);

/* ===== SHOW RATIONALE ===== */
setTimeout(()=>{
  document.getElementById("rationale").style.animationDelay="0s";
},4500);
</script>

</body>
</html>
