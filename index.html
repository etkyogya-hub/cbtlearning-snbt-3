<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Overlay Internal Scatter</title>
<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  background:transparent;
  overflow:hidden;
}
#text{
  position:absolute;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:Arial, Helvetica, sans-serif;
  font-size:5vw;
  font-weight:900;
  color:white;
}
.char{
  display:inline-block;
  animation: jitter 1.4s ease-in-out forwards;
}
@keyframes jitter{
  0%{transform:translate(0,0);opacity:1;}
  40%{transform:translate(var(--x),var(--y));}
  100%{transform:translate(0,0);opacity:0.9;}
}
</style>
</head>
<body>

<div id="text"></div>

<script>
const text = "SOAL INI MENIPU LOGIKA";
const wrap = document.getElementById("text");

[...text].forEach(c=>{
  const s=document.createElement("span");
  s.className="char";
  s.textContent=c;
  s.style.setProperty("--x",(Math.random()*20-10)+"px");
  s.style.setProperty("--y",(Math.random()*20-10)+"px");
  wrap.appendChild(s);
});
</script>

</body>
</html>
