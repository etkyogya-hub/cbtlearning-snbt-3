<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>CBT LOCKED VISUAL</title>

<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#020617;
}

/* ===== STAGE ===== */
.stage{
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;
}

/* ===== FALLBACK VISUAL (ALWAYS ON) ===== */
.fallback{
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 30% 20%, #38bdf8 0%, transparent 40%),
    radial-gradient(circle at 70% 80%, #22c55e 0%, transparent 45%),
    linear-gradient(120deg,#020617,#020617);
  animation:moveBG 6s ease-in-out infinite;
  z-index:1;
}

@keyframes moveBG{
  0%{filter:brightness(1)}
  50%{filter:brightness(1.15)}
  100%{filter:brightness(1)}
}

/* ===== VIDEO (OPTIONAL) ===== */
video{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  z-index:2;
  opacity:0;
  transition:opacity .6s ease;
}

/* when video ready */
video.show{
  opacity:1;
}

/* ===== DEPTH ===== */
.depth{
  position:absolute;
  inset:0;
  box-shadow:
    inset 0 0 120px rgba(0,0,0,.6),
    inset 0 0 260px rgba(0,0,0,.9);
  z-index:3;
  pointer-events:none;
}
</style>
</head>

<body>
<div class="stage">

  <!-- ALWAYS VISIBLE -->
  <div class="fallback"></div>

  <!-- VIDEO (IF EXISTS) -->
  <video id="vid" autoplay muted loop playsinline>
    <source src="SNBT+VO2.webm.mp4" type="video/mp4">
  </video>

  <div class="depth"></div>
</div>

<script>
const v = document.getElementById("vid");

/* KUNCI LOGIC */
v.addEventListener("canplay",()=>{
  v.classList.add("show"); // tampilkan video
});

v.addEventListener("error",()=>{
  console.log("VIDEO FAIL → FALLBACK STAYS");
});

/* SAFETY: kalau 1.5 detik tidak ready */
setTimeout(()=>{
  if(v.readyState < 2){
    console.log("VIDEO TIMEOUT → FALLBACK ONLY");
  }
},1500);
</script>
</body>
</html>
