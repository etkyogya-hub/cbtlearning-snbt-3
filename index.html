<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SNBT – Penalaran Figural</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#000;
  font-family:Arial,Helvetica,sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.phone{
  width:360px;
  height:640px;
  background:#fff;
  border-radius:36px;
  padding:16px;
}

/* TITLE */
.title{
  font-weight:900;
  font-size:20px;
  text-align:center;
  animation:shake .12s infinite alternate,color .3s infinite alternate;
}
@keyframes shake{from{transform:translateX(-1px)}to{transform:translateX(1px)}}
@keyframes color{0%{color:#d00}50%{color:#00f}100%{color:#080}}

/* GRID */
.top{
  display:flex;
  justify-content:space-between;
  margin-top:18px;
}
.frame{
  width:150px;
  height:150px;
  border:2px solid #000;
  position:relative;
}
.eq,.colon{
  font-size:28px;
  font-weight:900;
  align-self:center;
  margin:0 4px;
}

/* SHAPES */
.trap{
  position:absolute;
  left:16px; top:24px;
  width:90px; height:90px;
  clip-path:polygon(20% 0,80% 0,100% 100%,0 100%);
  border:2px solid #000;
}
.trap.fill{background:repeating-linear-gradient(45deg,#000 0 2px,transparent 2px 4px)}

.circle{
  position:absolute;
  width:18px;height:18px;
  border:2px solid #000;
  border-radius:50%;
}
.circle.fill{background:#000}

.half{
  position:absolute;
  left:18px; top:36px;
  width:90px;height:45px;
  border:2px solid #000;
  border-bottom:none;
  border-radius:90px 90px 0 0;
}
.half.fill{background:repeating-linear-gradient(45deg,#000 0 2px,transparent 2px 4px)}

.square{
  position:absolute;
  width:18px;height:18px;
  border:2px solid #000;
}
.square.fill{background:#000}

/* OPTIONS */
.options{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  margin-top:22px;
}
.opt{
  border:2px solid #000;
  height:140px;
  position:relative;
}
.label{
  position:absolute;
  top:4px;left:6px;
  font-weight:900;
}
</style>
</head>

<body>
<div class="phone">

<div class="title">SNBT – PENALARAN FIGURAL</div>

<!-- A : B -->
<div class="top">
  <div class="frame">
    <div class="trap"></div>
    <div class="circle" style="right:12px;top:18px"></div>
    <div class="circle fill" style="right:12px;top:58px"></div>
    <div class="circle" style="right:12px;top:98px"></div>
  </div>

  <div class="colon">:</div>

  <div class="frame">
    <div class="trap fill"></div>
    <div class="circle" style="right:12px;top:18px"></div>
    <div class="circle" style="right:12px;top:58px"></div>
    <div class="circle" style="right:12px;top:98px"></div>
  </div>
</div>

<div class="eq" style="text-align:center;margin:6px 0">=</div>

<!-- C : ? -->
<div class="top">
  <div class="frame">
    <div class="half"></div>
    <div class="square" style="right:12px;top:18px"></div>
    <div class="square fill" style="right:12px;top:58px"></div>
    <div class="square" style="right:12px;top:98px"></div>
  </div>

  <div class="colon">:</div>

  <div class="frame" style="display:flex;justify-content:center;align-items:center;font-size:40px;font-weight:900">
    ?
  </div>
</div>

<!-- OPTIONS -->
<div class="options">

<div class="opt">
<span class="label">A</span>
<div class="half"></div>
<div class="square" style="right:12px;top:18px"></div>
<div class="square" style="right:12px;top:58px"></div>
<div class="square fill" style="right:12px;top:98px"></div>
</div>

<div class="opt">
<span class="label">B</span>
<div class="half fill"></div>
<div class="square fill" style="right:12px;top:18px"></div>
<div class="square" style="right:12px;top:58px"></div>
<div class="square" style="right:12px;top:98px"></div>
</div>

<div class="opt">
<span class="label">C</span>
<div class="half fill"></div>
<div class="square" style="right:12px;top:18px"></div>
<div class="square" style="right:12px;top:58px"></div>
<div class="square" style="right:12px;top:98px"></div>
</div>

<div class="opt">
<span class="label">D</span>
<div class="half"></div>
<div class="square" style="right:12px;top:18px"></div>
<div class="square fill" style="right:12px;top:58px"></div>
<div class="square" style="right:12px;top:98px"></div>
</div>

</div>

</div>
</body>
</html>
