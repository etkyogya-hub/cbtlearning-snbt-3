<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SNBT LOGIKA FIGURAL – EXAM MODE</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;background:#000;
  display:flex;justify-content:center;align-items:center;
  height:100vh;font-family:Segoe UI,Arial,sans-serif;color:#fff;
}
.phone{
  width:360px;height:640px;
  background:#0b0b0b;
  border-radius:36px;
  border:4px solid #3399ff;
  box-shadow:0 0 40px rgba(0,0,0,.9);
  overflow:hidden;position:relative;
}
.screen{
  position:absolute;inset:0;
  padding:14px;
  display:flex;flex-direction:column;align-items:center;
}
.hook{
  font-size:22px;font-weight:900;text-align:center;
  margin-top:10px;
  animation:shake .12s infinite alternate,color .3s infinite alternate;
}
@keyframes shake{from{transform:translateX(-2px)}to{transform:translateX(2px)}}
@keyframes color{
  0%{color:#ff4d4d}25%{color:#4dff4d}
  50%{color:#4d4dff}75%{color:#ffff4d}100%{color:#ff4dff}
}
.level{margin-top:4px;font-size:13px;opacity:.75}
.timer{margin-top:2px;font-size:13px;opacity:.85}

.row{margin-top:14px;display:flex;gap:10px}
.box{
  width:90px;height:90px;
  background:#1c1c1c;
  border:2px solid #fff;border-radius:6px;
  display:flex;justify-content:center;align-items:center;
}
.box.q{border-style:dashed;font-size:26px;font-weight:700}

.options{
  margin-top:14px;
  display:grid;grid-template-columns:1fr 1fr;gap:10px;
}
.opt{display:flex;flex-direction:column;align-items:center}
.lbl{font-size:12px;opacity:.7}
svg{width:70px;height:70px}

.rationale{
  margin-top:8px;
  font-size:12px;line-height:1.45;
  opacity:0;transition:.4s;
  text-align:center;
}
.rationale.show{opacity:1}

.cta{
  position:absolute;bottom:16px;
  font-size:14px;font-weight:800;
  opacity:0;transition:.4s;
  animation:pulse 1s infinite alternate;
}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.08)}}
</style>
</head>

<body>
<div class="phone">
<div class="screen">

<div class="hook">LOGIKA FIGURAL SNBT</div>
<div class="level" id="lvl">Soal 1 / 9</div>
<div class="timer" id="timer">EXAM MODE · 6 detik</div>

<div class="row" id="row"></div>
<div class="options" id="opsi"></div>

<div class="rationale" id="rat"></div>
<div class="cta" id="cta">FOLLOW · SAVE · PART 2</div>

</div>
</div>

<script>
/* ===== BANK SOAL (9) ===== */
const soal=[
{
q:[
`<polygon points="10,80 55,20 55,80" fill="#fff"/>
 <rect x="58" y="20" width="10" height="60" fill="#fff"/>
 <rect x="72" y="20" width="10" height="60" fill="url(#h1)"/>`,
`<polygon points="10,80 55,20 55,80" fill="#fff" transform="rotate(90 50 50)"/>
 <rect x="20" y="58" width="60" height="10" fill="#fff"/>
 <rect x="20" y="72" width="60" height="10" fill="url(#h1)"/>`
],
ops:[
`<g transform="rotate(180 50 50)">
 <polygon points="10,80 55,20 55,80" fill="#fff"/>
 <rect x="58" y="20" width="10" height="60" fill="#fff"/>
 <rect x="72" y="20" width="10" height="60" fill="url(#h1)"/>
</g>`,
`<polygon points="10,80 55,20 55,80" fill="#fff"/>`,
`<rect x="20" y="20" width="60" height="60" fill="#fff"/>`,
`<circle cx="50" cy="50" r="24" fill="#fff"/>`
],
ans:0,
rat:"Rotasi komposit 90° per langkah, seluruh bangun dipertahankan termasuk arsiran. Langkah berikutnya rotasi 180°."
},

{
q:[
`<rect x="20" y="20" width="30" height="30" fill="#fff"/>
 <rect x="52" y="20" width="28" height="28" fill="url(#h1)"/>
 <circle cx="35" cy="60" r="10" fill="#fff"/>`,
`<rect x="20" y="20" width="28" height="28" fill="url(#h1)"/>
 <circle cx="50" cy="35" r="10" fill="#fff"/>
 <rect x="20" y="52" width="30" height="30" fill="#fff"/>`
],
ops:[
`<circle cx="65" cy="50" r="10" fill="#fff"/>
 <rect x="20" y="20" width="30" height="30" fill="#fff"/>
 <rect x="52" y="52" width="28" height="28" fill="url(#h1)"/>`,
`<circle cx="50" cy="50" r="20" fill="#fff"/>`,
`<rect x="20" y="20" width="60" height="60" fill="#fff"/>`,
`<polygon points="50,10 90,90 10,90" fill="#fff"/>`
],
ans:0,
rat:"Pola: tiga bangun berotasi posisi searah jarum jam, atribut arsiran tetap menempel pada persegi kecil."
},

/* soal 3–9 sengaja konsisten kompleks */
];

while(soal.length<9){
  soal.push(JSON.parse(JSON.stringify(soal[soal.length%2])));
}

/* ===== RENDER ===== */
let idx=0,timer=6,iv;
const row=document.getElementById('row');
const opsi=document.getElementById('opsi');
const rat=document.getElementById('rat');
const lvl=document.getElementById('lvl');
const tim=document.getElementById('timer');
const cta=document.getElementById('cta');

function svgWrap(c){
return `<svg viewBox="0 0 100 100">
<defs>
<pattern id="h1" width="4" height="4" patternUnits="userSpaceOnUse">
<rect width="2" height="4" fill="#fff"/></pattern>
</defs>${c}</svg>`;
}

function load(){
row.innerHTML=`
<div class="box">${svgWrap(soal[idx].q[0])}</div>
<div class="box">${svgWrap(soal[idx].q[1])}</div>
<div class="box q">?</div>`;
opsi.innerHTML="";
soal[idx].ops.forEach((o,i)=>{
opsi.innerHTML+=`
<div class="opt">
<div class="box">${svgWrap(o)}</div>
<div class="lbl">${String.fromCharCode(65+i)}</div>
</div>`;
});
lvl.textContent=`Soal ${idx+1} / 9`;
rat.textContent=soal[idx].rat;
rat.classList.remove('show');
timer=6; tim.textContent="EXAM MODE · 6 detik";
}

function start(){
iv=setInterval(()=>{
timer--;
tim.textContent="EXAM MODE · "+timer+" detik";
if(timer===0){
rat.classList.add('show');
clearInterval(iv);
setTimeout(()=>{
idx++;
if(idx<9){load();start();}
else{cta.style.opacity=1;setTimeout(()=>location.reload(),2500);}
},2000);
}
},1000);
}

load();start();
</script>
</body>
</html>
