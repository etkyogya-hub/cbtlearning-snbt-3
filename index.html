<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>CBTLearning – HARD HOOK FIXED</title>

<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">

<style>
html,body{
  margin:0;height:100%;
  background:#020617;
  display:flex;justify-content:center;align-items:center;
  overflow:hidden;
}

/* PHONE */
.phone{
  width:240px;height:480px;
  position:relative;border-radius:36px;
  background:linear-gradient(160deg,#0f172a,#020617);
  box-shadow:0 60px 140px rgba(0,0,0,.85);
  animation:float 7s ease-in-out infinite;
}
@keyframes float{
  0%,100%{transform:translateY(0) rotateX(3deg) rotateY(-3deg)}
  50%{transform:translateY(-6px) rotateX(5deg) rotateY(-5deg)}
}
.phone::before{
  content:"";position:absolute;inset:-3px;
  border-radius:38px;
  background:linear-gradient(180deg,transparent,rgba(56,189,248,.6),transparent);
  opacity:.55;
}

/* SCREEN */
.screen{
  position:absolute;inset:12px;
  border-radius:26px;overflow:hidden;
  background:#000;
}

/* VIDEO */
.bgvideo{
  position:absolute;inset:0;
  width:100%;height:100%;
  object-fit:cover;opacity:.85;
}

/* ===== STAY TITLE (ANTI-BLACK FRAME) ===== */
.title-wrap{
  position:absolute;
  top:14px;
  width:100%;
  text-align:center;
  pointer-events:none;
}
.title{
  font-family:'Anton',sans-serif;
  font-size:20px;
  letter-spacing:1px;
  color:#e0f2fe;
  text-shadow:0 0 18px rgba(56,189,248,.9);
  position:relative;
  z-index:2;
}

/* GHOST LETTERS (SUKMA) */
.ghost{
  position:absolute;
  inset:0;
  font-family:'Anton',sans-serif;
  font-size:20px;
  letter-spacing:1px;
  color:#7dd3fc;
  opacity:.35;
  animation:ghostZoom 1.6s ease-in-out infinite;
}
@keyframes ghostZoom{
  0%{transform:scale(1);opacity:.35}
  50%{transform:scale(1.35);opacity:0}
  100%{transform:scale(1);opacity:.35}
}

/* SOAL */
.soal{
  position:absolute;
  top:58px;
  left:7%;width:86%;
  font-family:'Anton',sans-serif;
  font-size:22px;
  line-height:1.28;
  text-align:center;
  background:linear-gradient(90deg,#e0f2fe,#38bdf8,#818cf8,#38bdf8,#e0f2fe);
  background-size:300% 100%;
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  text-shadow:0 0 14px rgba(255,255,255,.35);
  opacity:0;
}
.flow{animation:electric 1.4s linear infinite;}
@keyframes electric{
  0%{background-position:0% 50%}
  100%{background-position:100% 50%}
}
.shake{animation:shake .6s ease-in-out;}
@keyframes shake{
  0%{transform:translateX(0)}
  25%{transform:translateX(-2px)}
  50%{transform:translateX(2px)}
  75%{transform:translateX(-1px)}
  100%{transform:translateX(0)}
}

/* OPSI */
.opsi{
  position:absolute;
  top:220px;
  left:10%;width:80%;
  font-size:13px;
  line-height:1.65;
  color:#e5e7eb;
  opacity:0;
}

/* RATIONALE */
.rationale{
  position:absolute;bottom:58px;left:8%;width:84%;
  font-size:12px;color:#fff;text-align:center;
  opacity:0;text-shadow:0 0 16px rgba(255,255,255,.6);
}

/* CTA */
.cta{
  position:absolute;bottom:100px;width:100%;
  text-align:center;font-size:14px;font-weight:700;
  color:#e0f2fe;opacity:0;
  text-shadow:0 0 20px rgba(56,189,248,.8);
}

/* SEPARATOR */
.separator{
  position:absolute;inset:0;
  background:#020617;opacity:0;
  transition:opacity .25s ease;
}
.separator.show{opacity:1}
.show{opacity:1;transition:opacity .5s ease;}
</style>
</head>

<body>

<div class="phone" id="phone">
  <div class="screen">

    <video class="bgvideo" autoplay muted loop playsinline>
      <source src="CBT-Demo.mp4" type="video/mp4">
    </video>

    <!-- STAY TITLE -->
    <div class="title-wrap">
      <div class="title">SNBT – HARD REASONING</div>
      <div class="ghost">SNBT – HARD REASONING</div>
    </div>

    <div class="soal" id="soal"></div>
    <div class="opsi" id="opsi"></div>
    <div class="rationale" id="rat"></div>
    <div class="cta" id="cta">Tool-nya ada. Cek bio.</div>
    <div class="separator" id="sep"></div>

  </div>
</div>

<script>
/* DATA TETAP */
const data=[ /* sama seperti sebelumnya */ ];

const soal=document.getElementById("soal");
const opsi=document.getElementById("opsi");
const rat=document.getElementById("rat");
const sep=document.getElementById("sep");
const cta=document.getElementById("cta");
const phone=document.getElementById("phone");

const hues=[195,210,225,240];
let i=0;

function next(){
  sep.classList.remove("show");
  soal.className="soal";
  opsi.className="opsi";
  rat.className="rationale";

  const d=data[i];
  soal.innerHTML=d.q;
  opsi.innerHTML=d.o;
  rat.innerHTML=d.r;

  const hue=hues[Math.floor(Math.random()*hues.length)];
  phone.style.background=`linear-gradient(160deg,hsl(${hue},45%,18%),#020617)`;

  setTimeout(()=>soal.classList.add("show","flow","shake"),250);
  setTimeout(()=>opsi.classList.add("show"),900);
  setTimeout(()=>rat.classList.add("show"),1500);
  setTimeout(()=>sep.classList.add("show"),3300);

  if(i===data.length-1){
    setTimeout(()=>cta.classList.add("show"),4300);
  }

  i=(i+1)%data.length;
  setTimeout(next,4000);
}
next();
</script>

</body>
</html>
