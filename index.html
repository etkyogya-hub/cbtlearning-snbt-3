<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CBTEXAM – FYP Engine</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  background: black;
  font-family: Arial, sans-serif;
  overflow: hidden;
  color: white;
}

#frame {
  width: 100vw;
  height: 100vh;
  aspect-ratio: 9/16;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}

.screen {
  position: absolute;
  width: 100%;
  height: 100%;
  padding: 40px 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  opacity: 0;
  transition: opacity 0.6s;
}

.active { opacity: 1; }

.big {
  font-size: 2.3em;
  font-weight: 800;
}

.medium {
  font-size: 1.5em;
}

.small {
  font-size: 1em;
  opacity: 0.7;
}

.glitch {
  animation: glitch 0.15s infinite;
}

@keyframes glitch {
  0% { transform: translate(0); }
  20% { transform: translate(-2px, 2px); }
  40% { transform: translate(2px, -2px); }
  60% { transform: translate(-2px, -2px); }
  80% { transform: translate(2px, 2px); }
  100% { transform: translate(0); }
}

.countdown {
  font-size: 4em;
  color: #ff2d2d;
}

.brand {
  position: absolute;
  top: 15px;
  width: 100%;
  text-align: center;
  font-size: 0.9em;
  opacity: 0.6;
}
</style>
</head>
<body>

<div id="frame">

<div class="brand">CBTEXAM</div>

<div id="s1" class="screen active">
  <div class="big glitch">98% ORANG SALAH DI SOAL INI</div>
</div>

<div id="s2" class="screen">
  <div class="medium">Jangan jawab cepat.</div>
</div>

<div id="s3" class="screen">
  <div class="countdown" id="count">5</div>
</div>

<div id="s4" class="screen">
  <div class="big">
    Jika semua A adalah B<br>
    dan semua B adalah C,<br><br>
    apakah semua A adalah C?
  </div>
</div>

<div id="s5" class="screen">
  <div class="medium">Jawaban di akhir.</div>
</div>

<div id="s6" class="screen">
  <div>
    <div class="big">YA ✅</div>
    <div class="small">Ini silogisme valid.</div>
  </div>
</div>

<div id="s7" class="screen">
  <div>
    <div class="medium">Mau lanjut level berikutnya?</div>
    <div class="small">Follow CBTEXAM</div>
  </div>
</div>

</div>

<script>
const screens = ["s1","s2","s3","s4","s5","s6","s7"];
let i = 0;

function showNext() {
  if (i > 0) document.getElementById(screens[i-1]).classList.remove("active");
  if (i < screens.length) {
    document.getElementById(screens[i]).classList.add("active");
  }
  i++;
}

showNext();
setTimeout(showNext, 2000);
setTimeout(showNext, 4000);

let c = 5;
const timer = setInterval(() => {
  const el = document.getElementById("count");
  if (!el) return;
  el.innerText = c;
  c--;
  if (c < 0) clearInterval(timer);
}, 1000);

setTimeout(showNext, 9000);
setTimeout(showNext, 14000);
setTimeout(showNext, 18000);
setTimeout(showNext, 23000);
</script>

</body>
</html>
