<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Phone Mockup Blue Edge</title>

<style>
html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  background:#000;
  overflow:hidden;
  display:flex;
  justify-content:center;
  align-items:center;
}

/* PHONE BODY */
.phone{
  width:360px;
  height:720px;
  background:#111;
  border-radius:42px;
  box-shadow:0 30px 80px rgba(0,0,0,.7);
  position:relative;
  transform:perspective(900px) rotateX(5deg) rotateY(-5deg);
}

/* SCREEN (NORMAL, TANPA WARNA) */
.screen{
  position:absolute;
  inset:10px;
  border-radius:34px;
  background:#000;
  overflow:hidden;
}

/* BLUE EDGE GLOW (PINGGIRAN SAJA) */
.screen::before{
  content:'';
  position:absolute;
  inset:0;
  border-radius:34px;
  pointer-events:none;
  box-shadow:
    inset 0 0 0 2px rgba(80,140,255,.35),
    inset 0 0 18px rgba(80,140,255,.25),
    inset 0 0 36px rgba(80,140,255,.15);
  z-index:5;
}

/* VIDEO (NORMAL HP SCREEN) */
video{
  width:100%;
  height:100%;
  object-fit:cover;
  position:relative;
  z-index:1;
}

/* OVERLAY COMMON */
.overlay{
  position:absolute;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  pointer-events:none;
  font-family:'Anton',sans-serif;
  z-index:10;
}

/* HOOK SHAKY (STAY) */
#hook{
  font-size:32px;
  color:#fff;
  transform:scale(1.35);
  animation:
    hookShake 1.2s ease-out forwards,
    hookSettle .8s ease forwards 1.2s;
}
@keyframes hookShake{
  0%{transform:scale(1.5) translateX(-4px);}
  20%{transform:scale(1.5) translateX(4px);}
  40%{transform:scale(1.5) translateX(-2px);}
  60%{transform:scale(1.5) translateX(2px);}
  100%{transform:scale(1.5) translateX(0);}
}
@keyframes hookSettle{
  to{
    transform:scale(1);
  }
}

/* TENSION */
#tension{
  position:absolute;
  bottom:22%;
  font-size:16px;
  color:#e6f0ff;
  opacity:0;
  animation:tensionFade 4s ease forwards;
  animation-delay:5s;
  z-index:10;
}
@keyframes tensionFade{
  0%{opacity:0}
  20%{opacity:1}
  80%{opacity:1}
  100%{opacity:0}
}

/* CTA */
#cta{
  position:absolute;
  bottom:14%;
  left:50%;
  transform:translateX(-50%);
  font-size:18px;
  color:white;
  opacity:0;
  animation:ctaIn 1.2s ease forwards;
  animation-delay:13.5s;
  z-index:10;
}
@keyframes ctaIn{
  from{opacity:0;transform:translate(-50%,20px)}
  to{opacity:1;transform:translate(-50%,0)}
}
</style>
</head>

<body>

<div class="phone">
  <div class="screen">

    <video autoplay muted playsinline>
      <source src="lv_0_20260107052336.mp4" type="video/mp4">
    </video>

    <!-- HOOK -->
    <div class="overlay">
      <div id="hook">STOP. JANGAN JAWAB CEPAT.</div>
    </div>

    <!-- TENSION -->
    <div id="tension">Kelihatannya gampang. Tapi ini jebakan.</div>

    <!-- CTA -->
    <div id="cta">Ikutin selanjutnya.</div>

  </div>
</div>

</body>
</html>
