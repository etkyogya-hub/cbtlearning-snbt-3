<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SNBT Figural — NEXT LEVEL</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#000;display:flex;justify-content:center;align-items:center;height:100vh;font-family:Arial,sans-serif;color:#fff}
.phone{width:360px;height:640px;background:#0b0b0b;border-radius:36px;border:4px solid #3aa0ff;overflow:hidden;position:relative}
.screen{position:absolute;inset:0;padding:18px;display:none;flex-direction:column;align-items:center}
.screen.active{display:flex}
.hook{font-size:22px;font-weight:900;text-align:center;animation:shake .12s infinite alternate,color .25s infinite alternate}
@keyframes shake{from{transform:translateX(-2px)}to{transform:translateX(2px)}}
@keyframes color{0%{color:#ff5555}25%{color:#55ff55}50%{color:#5555ff}75%{color:#ffff55}100%{color:#ff55ff}}
.level{margin-top:6px;font-size:13px;opacity:.7}
.row{margin-top:18px;display:flex;gap:12px}
.box{width:96px;height:96px;background:#1c1c1c;border:2px solid #fff;border-radius:6px;display:flex;justify-content:center;align-items:center}
.box.q{border-style:dashed;font-size:32px;font-weight:800}
.options{margin-top:18px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{display:flex;flex-direction:column;align-items:center}
.lbl{font-size:12px;opacity:.6}
svg{width:78px;height:78px}
.rationale{margin-top:14px;font-size:13px;line-height:1.35;opacity:.9;text-align:center}
.cta{margin-top:20px;font-size:16px;font-weight:800;padding:10px 14px;border:2px solid #fff;border-radius:8px;animation:pulse .8s infinite alternate}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.06)}}
</style>
</head>

<body>
<div class="phone">
<script>
const P=(id)=>`
<defs>
<pattern id="${id}" width="4" height="4" patternUnits="userSpaceOnUse">
<line x1="0" y1="4" x2="4" y2="0" stroke="#fff" stroke-width="1"/>
</pattern>
</defs>`;

const Q=[
// 1 — jumlah vs orientasi
{
a:`<svg viewBox="0 0 100 100">${P('p1')}
<polygon points="10,10 70,10 10,70" fill="#fff"/>
<rect x="72" y="12" width="10" height="16" fill="url(#p1)"/>
<rect x="72" y="32" width="10" height="16" fill="url(#p1)"/>
<rect x="72" y="52" width="10" height="16" fill="url(#p1)"/>
</svg>`,
b:`<svg viewBox="0 0 100 100">${P('p1')}
<polygon points="90,10 30,10 90,70" fill="#fff"/>
<rect x="18" y="12" width="10" height="16" fill="url(#p1)"/>
<rect x="18" y="32" width="10" height="16" fill="url(#p1)"/>
<rect x="18" y="52" width="10" height="16" fill="url(#p1)"/>
</svg>`,
o:`<svg viewBox="0 0 100 100">${P('p1')}
<polygon points="10,90 70,90 10,30" fill="#fff"/>
<rect x="72" y="18" width="10" height="16" fill="url(#p1)"/>
<rect x="72" y="38" width="10" height="16" fill="url(#p1)"/>
<rect x="72" y="58" width="10" height="16" fill="url(#p1)"/>
</svg>`,
r:`Pola ganda: segitiga bermirror; jumlah & orientasi balok arsir tetap.`},
// 2 — pusat massa
{
a:`<svg viewBox="0 0 100 100">
<circle cx="30" cy="30" r="10" fill="#fff"/>
<circle cx="70" cy="30" r="10" fill="#fff"/>
<rect x="25" y="55" width="50" height="14" fill="#fff"/>
</svg>`,
b:`<svg viewBox="0 0 100 100">
<circle cx="30" cy="70" r="10" fill="#fff"/>
<circle cx="70" cy="70" r="10" fill="#fff"/>
<rect x="25" y="31" width="50" height="14" fill="#fff"/>
</svg>`,
o:`<svg viewBox="0 0 100 100">
<circle cx="30" cy="30" r="10" fill="#fff"/>
<circle cx="70" cy="70" r="10" fill="#fff"/>
<rect x="25" y="43" width="50" height="14" fill="#fff"/>
</svg>`,
r:`Dua pola: pasangan simetri + balok selalu di pusat massa.`},
// 3 — fragmentasi bertahap
{
a:`<svg viewBox="0 0 100 100">
<rect x="30" y="30" width="40" height="40" fill="#fff"/>
</svg>`,
b:`<svg viewBox="0 0 100 100">
<rect x="22" y="22" width="20" height="20" fill="#fff"/>
<rect x="58" y="58" width="20" height="20" fill="#fff"/>
</svg>`,
o:`<svg viewBox="0 0 100 100">
<rect x="18" y="18" width="16" height="16" fill="#fff"/>
<rect x="42" y="42" width="16" height="16" fill="#fff"/>
<rect x="66" y="66" width="16" height="16" fill="#fff"/>
</svg>`,
r:`Fragmentasi naik: 1 → 2 → 3 dengan arah diagonal tetap.`},
// 4 — rotasi + anchor
{
a:`<svg viewBox="0 0 100 100">
<polygon points="20,80 50,20 80,80" fill="#fff"/>
<rect x="44" y="52" width="12" height="26" fill="#000"/>
</svg>`,
b:`<svg viewBox="0 0 100 100">
<polygon points="20,20 80,20 50,80" fill="#fff"/>
<rect x="44" y="20" width="12" height="26" fill="#000"/>
</svg>`,
o:`<svg viewBox="0 0 100 100">
<polygon points="80,20 80,80 20,50" fill="#fff"/>
<rect x="20" y="44" width="26" height="12" fill="#000"/>
</svg>`,
r:`Rotasi 120°. Elemen hitam menempel sisi alas (anchor).`},
// 5 — diagonal traversal
{
a:`<svg viewBox="0 0 100 100">
<rect x="20" y="20" width="60" height="60" fill="#fff"/>
<circle cx="35" cy="35" r="10" fill="#000"/>
</svg>`,
b:`<svg viewBox="0 0 100 100">
<rect x="20" y="20" width="60" height="60" fill="#fff"/>
<circle cx="50" cy="50" r="10" fill="#000"/>
</svg>`,
o:`<svg viewBox="0 0 100 100">
<rect x="20" y="20" width="60" height="60" fill="#fff"/>
<circle cx="65" cy="65" r="10" fill="#000"/>
</svg>`,
r:`Titik bergerak di diagonal utama dengan jarak konstan.`},
// 6 — atribut swap
{
a:`<svg viewBox="0 0 100 100">${P('p2')}
<rect x="10" y="14" width="80" height="18" fill="#fff"/>
<rect x="10" y="42" width="80" height="18" fill="url(#p2)"/>
</svg>`,
b:`<svg viewBox="0 0 100 100">${P('p2')}
<rect x="10" y="42" width="80" height="18" fill="#fff"/>
<rect x="10" y="14" width="80" height="18" fill="url(#p2)"/>
</svg>`,
o:`<svg viewBox="0 0 100 100">${P('p2')}
<rect x="10" y="28" width="80" height="18" fill="#fff"/>
<rect x="10" y="56" width="80" height="18" fill="url(#p2)"/>
</svg>`,
r:`Solid ↔ arsir bertukar; posisi ikut bergeser teratur.`},
// 7 — orientasi pasangan
{
a:`<svg viewBox="0 0 100 100">
<circle cx="30" cy="50" r="10" fill="#fff"/>
<circle cx="70" cy="50" r="10" fill="#fff"/>
</svg>`,
b:`<svg viewBox="0 0 100 100">
<circle cx="30" cy="30" r="10" fill="#fff"/>
<circle cx="70" cy="70" r="10" fill="#fff"/>
</svg>`,
o:`<svg viewBox="0 0 100 100">
<circle cx="50" cy="30" r="10" fill="#fff"/>
<circle cx="50" cy="70" r="10" fill="#fff"/>
</svg>`,
r:`Orientasi pasangan: horizontal → diagonal → vertikal.`},
// 8 — inversi + penyeimbang
{
a:`<svg viewBox="0 0 100 100">
<rect x="20" y="20" width="18" height="60" fill="#fff"/>
<rect x="62" y="20" width="18" height="60" fill="#000"/>
</svg>`,
b:`<svg viewBox="0 0 100 100">
<rect x="20" y="20" width="18" height="60" fill="#000"/>
<rect x="62" y="20" width="18" height="60" fill="#fff"/>
</svg>`,
o:`<svg viewBox="0 0 100 100">
<rect x="20" y="20" width="18" height="60" fill="#fff"/>
<rect x="41" y="20" width="18" height="60" fill="#000"/>
<rect x="62" y="20" width="18" height="60" fill="#fff"/>
</svg>`,
r:`Inversi warna lalu tambah elemen penyeimbang visual.`},
// 9 — crossing symmetry
{
a:`<svg viewBox="0 0 100 100">
<polygon points="20,20 80,20 50,50" fill="#fff"/>
<polygon points="20,80 80,80 50,50" fill="#fff"/>
</svg>`,
b:`<svg viewBox="0 0 100 100">
<polygon points="20,20 50,50 20,80" fill="#fff"/>
<polygon points="80,20 50,50 80,80" fill="#fff"/>
</svg>`,
o:`<svg viewBox="0 0 100 100">
<polygon points="20,20 80,80 50,50" fill="#fff"/>
<polygon points="80,20 20,80 50,50" fill="#fff"/>
</svg>`,
r:`Dua segitiga selalu berpotongan di pusat; orientasi berubah sistematis.`}
];

let html='';
Q.forEach((q,i)=>{
html+=`
<div class="screen ${i===0?'active':''}">
  <div class="hook">LOGIKA FIGURAL</div>
  <div class="level">Soal ${i+1} / 9</div>
  <div class="row">
    <div class="box">${q.a}</div>
    <div class="box">${q.b}</div>
    <div class="box q">?</div>
  </div>
  <div class="options">
    <div class="opt"><div class="box">${q.o}</div><div class="lbl">A</div></div>
    <div class="opt"><div class="box">${q.a}</div><div class="lbl">B</div></div>
    <div class="opt"><div class="box">${q.b}</div><div class="lbl">C</div></div>
    <div class="opt"><div class="box">${q.a}</div><div class="lbl">D</div></div>
  </div>
  <div class="rationale">${q.r}</div>
  ${i===8?'<div class="cta">FOLLOW • SAVE • PART 2 ➜</div>':''}
</div>`;
});
document.write(html);

let idx=0;
setInterval(()=>{
  const s=document.querySelectorAll('.screen');
  s.forEach(e=>e.classList.remove('active'));
  idx=(idx+1)%s.length;
  s[idx].classList.add('active');
},4200);
</script>
</div>
</body>
</html>
