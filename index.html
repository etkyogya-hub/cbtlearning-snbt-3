<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CBT Figural Logic</title>
<style>
body{
  margin:0;
  background:#111;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  font-family:Arial, Helvetica, sans-serif;
}

/* PHONE FRAME */
.phone{
  width:360px;
  height:640px; /* 9:16 */
  background:#000;
  border-radius:28px;
  overflow:hidden;
  position:relative;
  color:#fff;
}

/* TITLE HOOK */
.title{
  position:absolute;
  top:16px;
  width:100%;
  text-align:center;
  font-size:18px;
  font-weight:900;
  animation:shake 0.4s infinite, colorShift 2s infinite;
}

/* SHAKE */
@keyframes shake{
  0%{transform:translate(0,0);}
  25%{transform:translate(2px,-2px);}
  50%{transform:translate(-2px,2px);}
  75%{transform:translate(2px,2px);}
  100%{transform:translate(0,0);}
}

/* COLOR SHIFT */
@keyframes colorShift{
  0%{color:#ff2f2f;}
  50%{color:#00ffcc;}
  100%{color:#ff2f2f;}
}

/* TIMER */
#timer{
  position:absolute;
  top:56px;
  width:100%;
  text-align:center;
  font-size:56px;
  font-weight:900;
}

/* FIGURAL GRID */
.grid{
  position:absolute;
  top:140px;
  width:100%;
  display:grid;
  grid-template-columns:repeat(3,70px);
  grid-template-rows:repeat(3,70px);
  gap:10px;
  justify-content:center;
}
.cell{
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:34px;
  background:#111;
  border:2px solid #444;
}

/* COMMENT BUBBLE (UI SIMULATION) */
.comment{
  position:absolute;
  bottom:130px;
  left:16px;
  background:#1f1f1f;
  padding:10px 14px;
  border-radius:18px;
  font-size:12px;
  opacity:0;
  animation:commentPop 0.8s forwards;
  animation-delay:3s;
}

@keyframes commentPop{
  from{opacity:0; transform:scale(0.8);}
  to{opacity:1; transform:scale(1);}
}

/* CTA */
#cta{
  position:absolute;
  bottom:24px;
  left:50%;
  transform:translateX(-50%);
  background:#ff2f2f;
  padding:12px 22px;
  border-radius:20px;
  font-size:14px;
  font-weight:bold;
  opacity:0;
  transition:opacity 0.4s;
}
</style>
</head>

<body>

<div class="phone">

  <!-- HOOK -->
  <div class="title">FIGURAL LOGIC TEST</div>

  <!-- TIMER -->
  <div id="timer">15</div>

  <!-- FIGURAL CBT -->
  <div class="grid">
    <div class="cell">└</div>
    <div class="cell">┴</div>
    <div class="cell">┬</div>

    <div class="cell">├</div>
    <div class="cell">┼</div>
    <div class="cell">┤</div>

    <div class="cell">┌</div>
    <div class="cell">┬</div>
    <div class="cell">?</div>
  </div>

  <!-- COMMENT UI -->
  <div class="comment">Jawaban apa?</div>

  <!-- CTA -->
  <div id="cta">Komentar jawabannya 👇</div>

</div>

<script>
let t = 15;
const timer = document.getElementById("timer");
const cta = document.getElementById("cta");

const run = setInterval(()=>{
  t--;
  timer.textContent = t;
  if(t <= 0){
    clearInterval(run);
    cta.style.opacity = 1;
  }
},1000);
</script>

</body>
</html>
