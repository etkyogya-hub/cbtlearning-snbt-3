<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>CBT Answer Click Visual</title>

<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#020617;
}

/* ===== STAGE ===== */
.stage{
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;
}

/* ===== BACKGROUND (ALWAYS ON) ===== */
.bg{
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 25% 30%, #38bdf8 0%, transparent 45%),
    radial-gradient(circle at 75% 70%, #22c55e 0%, transparent 50%),
    linear-gradient(160deg,#020617,#020617);
  animation:bgPulse 7s ease-in-out infinite;
  z-index:1;
}
@keyframes bgPulse{
  0%,100%{filter:brightness(1)}
  50%{filter:brightness(1.18)}
}

/* ===== OPTIONS ===== */
.options{
  position:absolute;
  inset:0;
  z-index:2;
  pointer-events:none;
}

.option{
  position:absolute;
  left:50%;
  width:76%;
  height:16%;
  background:#0f172a;
  border-radius:14px;
  box-shadow:
    0 18px 36px rgba(0,0,0,.45),
    inset 0 0 0 1px rgba(255,255,255,.08);
  transform:translateX(-50%) scale(.92);
  opacity:0;
  animation:optionFlow 8s ease-in-out infinite;
}

/* vertical placement */
.option:nth-child(1){top:30%; animation-delay:0s}
.option:nth-child(2){top:48%; animation-delay:0s}
.option:nth-child(3){top:66%; animation-delay:0s}

/* FLOW */
@keyframes optionFlow{
  0%{
    opacity:0;
    transform:translateX(-50%) scale(.9);
  }
  15%{
    opacity:1;
    transform:translateX(-50%) scale(1);
  }
  45%{
    opacity:1;
    transform:translateX(-50%) scale(1);
  }
  55%{
    opacity:.25;
    transform:translateX(-50%) scale(.96);
  }
  100%{
    opacity:0;
    transform:translateX(-50%) translateY(-30px) scale(.9);
  }
}

/* ===== CORRECT CLICK ===== */
.correct{
  animation:correctPick 8s ease-in-out infinite;
}

@keyframes correctPick{
  0%,35%{
    opacity:0;
    transform:translateX(-50%) scale(.9);
  }
  45%{
    opacity:1;
    transform:translateX(-50%) scale(1.04);
    box-shadow:
      0 0 0 2px rgba(56,189,248,.9),
      0 24px 48px rgba(0,0,0,.6);
  }
  70%{
    opacity:1;
    transform:translateX(-50%) scale(1.06);
  }
  100%{
    opacity:0;
    transform:translateX(-50%) translateY(-40px) scale(1);
  }
}

/* ===== OPTIONAL VIDEO ===== */
video{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  opacity:0;
  z-index:3;
  transition:opacity .6s ease;
}
video.show{opacity:1}

/* ===== DEPTH ===== */
.depth{
  position:absolute;
  inset:0;
  box-shadow:
    inset 0 0 160px rgba(0,0,0,.7),
    inset 0 0 340px rgba(0,0,0,.95);
  z-index:4;
  pointer-events:none;
}
</style>
</head>

<body>
<div class="stage">

  <div class="bg"></div>

  <div class="options">
    <div class="option"></div>
    <div class="option correct"></div>
    <div class="option"></div>
  </div>

  <!-- VIDEO OPTIONAL -->
  <video id="vid" autoplay muted loop playsinline>
    <source src="SNBT+VO2.webm.mp4" type="video/mp4">
  </video>

  <div class="depth"></div>
</div>

<script>
const v=document.getElementById("vid");
v.addEventListener("canplay",()=>v.classList.add("show"));
v.addEventListener("error",()=>console.log("video fail → visual only"));
</script>
</body>
</html>
