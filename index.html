<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1"/>

<title>CBT Learning – Real Test</title>

<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">

<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  background:#020617;
  overflow:hidden;
  font-family:system-ui, Arial;
}

/* ===== STAGE ===== */
.stage{
  width:100vw;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

/* ===== PHONE ===== */
.phone{
  width:300px;
  height:540px;
  position:relative;
  transform-style:preserve-3d;
  animation:float 6s ease-in-out infinite;
}
@keyframes float{
  0%,100%{transform:rotateX(4deg) rotateY(-4deg)}
  50%{transform:rotateX(7deg) rotateY(-7deg)}
}
.body{
  position:absolute;
  inset:0;
  border-radius:38px;
  background:#020617;
  box-shadow:0 60px 150px rgba(0,0,0,.85);
}
.body::before{
  content:"";
  position:absolute;
  inset:-2px;
  border-radius:40px;
  background:linear-gradient(180deg, transparent, rgba(56,189,248,.55), transparent);
}

/* ===== SCREEN ===== */
.screen{
  position:absolute;
  inset:16px;
  border-radius:30px;
  background:#020617;
  padding:18px;
  box-sizing:border-box;
  color:#fff;
}

/* ===== SOAL ===== */
.soal{
  font-family:'Anton', sans-serif;
  font-size:26px;
  line-height:1.35;
  letter-spacing:1px;
  margin-bottom:16px;
}

/* ===== OPSI ===== */
.opsi{
  margin-bottom:10px;
  padding:10px 12px;
  border-radius:10px;
  background:#020617;
  border:1px solid #334155;
  font-size:14px;
  transition:.3s;
}
.opsi.correct{
  border-color:#22c55e;
  color:#22c55e;
}
.opsi.wrong{
  border-color:#ef4444;
  color:#ef4444;
}

/* ===== HOLD ===== */
.hold{
  position:absolute;
  bottom:88px;
  left:18px;
  font-size:12px;
  color:#94a3b8;
  opacity:0;
  animation:holdIn 8s forwards;
}
@keyframes holdIn{
  0%,50%{opacity:0}
  60%,100%{opacity:1}
}

/* ===== RATIONALE ===== */
.rationale{
  position:absolute;
  bottom:28px;
  left:18px;
  right:18px;
  font-size:13px;
  color:#e5e7eb;
  opacity:0;
  animation:ratIn 8s forwards;
}
@keyframes ratIn{
  0%,65%{opacity:0}
  75%,100%{opacity:1}
}
</style>
</head>

<body>
<div class="stage">
<div class="phone">
<div class="body"></div>

<div class="screen">

  <!-- SOAL -->
  <div class="soal">
    Jika 3x + 5 = 20,<br>
    maka nilai x adalah …
  </div>

  <!-- OPSI -->
  <div class="opsi">A. 3</div>
  <div class="opsi correct">B. 5</div>
  <div class="opsi">C. 6</div>
  <div class="opsi">D. 7</div>
  <div class="opsi">E. 8</div>

  <!-- HOLD -->
  <div class="hold">tahan… jangan jawab dulu</div>

  <!-- RATIONALE -->
  <div class="rationale">
    Rationale: kurangi 5 dari kedua sisi → 3x = 15 → x = 5.
    Bukan soal hitung, tapi disiplin langkah.
  </div>

</div>
</div>
</div>
</body>
</html>
