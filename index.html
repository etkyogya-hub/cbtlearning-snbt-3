<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TikTok Mockup – UTBK Series</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #0b0b0b;
      font-family: Inter, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: #fff;
    }

    .phone {
      width: 360px;
      height: 640px;
      background: #000;
      border-radius: 28px;
      padding: 16px;
      box-shadow: 0 0 40px rgba(255,255,255,0.08);
      position: relative;
      overflow: hidden;
    }

    .screen {
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at top, #111, #000);
      border-radius: 20px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .hook {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: -0.5px;
      margin-bottom: 16px;
      animation: pop 0.6s ease;
    }

    .sub {
      font-size: 14px;
      opacity: 0.7;
      margin-bottom: 32px;
    }

    .card {
      width: 100%;
      padding: 18px;
      border-radius: 14px;
      background: linear-gradient(180deg, #111, #050505);
      border: 1px solid rgba(255,255,255,0.08);
      margin-bottom: 14px;
    }

    .question {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .option {
      font-size: 14px;
      padding: 8px 10px;
      border-radius: 8px;
      background: #0e0e0e;
      margin: 6px 0;
      border: 1px solid rgba(255,255,255,0.05);
    }

    .cta {
      position: absolute;
      bottom: 24px;
      width: 100%;
      left: 0;
      text-align: center;
      font-size: 14px;
      opacity: 0.8;
    }

    @keyframes pop {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="phone">
    <div class="screen">
      <div class="hook">❗ 98% ORANG SALAH DI SOAL INI</div>
      <div class="sub">UTBK TOP 1% — SIAPKAN LOGIKA MU</div>

      <div class="card">
        <div class="question">Jika 3 = 9, 4 = 16, maka 5 = ?</div>
        <div class="option">A. 20</div>
        <div class="option">B. 25</div>
        <div class="option">C. 15</div>
        <div class="option">D. 10</div>
      </div>

      <div class="cta">Follow kalau mau level lebih brutal.</div>
    </div>
  </div>
</body>
</html>
