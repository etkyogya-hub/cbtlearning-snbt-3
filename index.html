<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SNBT LOGIKA FIGURAL</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#000;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  font-family:Segoe UI,Arial,sans-serif;
  color:#fff;
}

/* MOCKUP HP */
.phone{
  width:360px;
  height:640px;
  background:#0b0b0b;
  border-radius:36px;
  border:4px solid #3399ff;
  box-shadow:0 0 35px rgba(0,0,0,.8);
  overflow:hidden;
  position:relative;
}

/* SCREEN */
.screen{
  position:absolute;
  inset:0;
  padding:18px;
  display:flex;
  flex-direction:column;
  align-items:center;
}

/* HOOK */
.hook{
  font-size:22px;
  font-weight:900;
  text-align:center;
  margin-top:18px;
  animation:shake .12s infinite alternate,colorchange .3s infinite alternate;
}
@keyframes shake{
  from{transform:translateX(-2px)}
  to{transform:translateX(2px)}
}
@keyframes colorchange{
  0%{color:#ff4d4d}
  25%{color:#4dff4d}
  50%{color:#4d4dff}
  75%{color:#ffff4d}
  100%{color:#ff4dff}
}

/* QUESTION */
.level{
  margin-top:10px;
  font-size:13px;
  opacity:.75;
}

.soal{
  margin-top:18px;
  display:flex;
  gap:10px;
  align-items:center;
}

/* FIGURE BOX */
.box{
  width:78px;
  height:78px;
  background:#1c1c1c;
  border:2px solid #fff;
  border-radius:6px;
  display:flex;
  flex-wrap:wrap;
  align-content:center;
  justify-content:center;
  gap:4px;
}

.box.q{
  border-style:dashed;
  font-size:26px;
  font-weight:700;
}

/* SHAPES */
.shape{width:16px;height:16px;background:#fff}

.circle{border-radius:50%}

.tri-right{
  width:0;height:0;
  border-left:16px solid #fff;
  border-top:8px solid transparent;
  border-bottom:8px solid transparent;
}

.tri-iso{
  width:0;height:0;
  border-left:8px solid transparent;
  border-right:8px solid transparent;
  border-bottom:16px solid #fff;
}

.rect{width:16px;height:8px}

.rect-striped{
  width:16px;height:8px;
  background:repeating-linear-gradient(
    45deg,#fff 0 2px,transparent 2px 4px
  );
}

.half-circle{
  width:16px;height:8px;
  background:#fff;
  border-radius:8px 8px 0 0;
}

/* OPTIONS */
.options{
  margin-top:22px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.opt{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
}

.label{
  font-size:12px;
  opacity:.7;
}
</style>
</head>

<body>
<div class="phone">
  <div class="screen">

    <!-- HOOK -->
    <div class="hook">LOGIKA FIGURAL SNBT</div>
    <div class="level">Soal 1</div>

    <!-- QUESTION FIGURE -->
    <div class="soal">
      <div class="box">
        <div class="tri-right"></div>
        <div class="rect"></div>
        <div class="rect-striped"></div>
      </div>

      <div class="box">
        <div class="tri-right" style="transform:rotate(90deg)"></div>
        <div class="rect" style="transform:rotate(90deg)"></div>
        <div class="rect-striped" style="transform:rotate(90deg)"></div>
      </div>

      <div class="box q">?</div>
    </div>

    <!-- OPTIONS -->
    <div class="options">

      <!-- A (BENAR) -->
      <div class="opt">
        <div class="box">
          <div class="tri-right" style="transform:rotate(180deg)"></div>
          <div class="rect" style="transform:rotate(180deg)"></div>
          <div class="rect-striped" style="transform:rotate(180deg)"></div>
        </div>
        <div class="label">A</div>
      </div>

      <!-- B -->
      <div class="opt">
        <div class="box">
          <div class="tri-iso"></div>
          <div class="rect"></div>
          <div class="rect-striped"></div>
        </div>
        <div class="label">B</div>
      </div>

      <!-- C -->
      <div class="opt">
        <div class="box">
          <div class="circle"></div>
          <div class="rect"></div>
        </div>
        <div class="label">C</div>
      </div>

      <!-- D -->
      <div class="opt">
        <div class="box">
          <div class="half-circle"></div>
          <div class="rect-striped"></div>
        </div>
        <div class="label">D</div>
      </div>

    </div>

  </div>
</div>
</body>
</html>
