<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>CBT Rationale Reveal</title>

<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#020617;
}

/* ===== STAGE ===== */
.stage{
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;
}

/* ===== BACKGROUND MOTION (ANTI HITAM) ===== */
.bg{
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 30% 25%, #38bdf8 0%, transparent 45%),
    radial-gradient(circle at 70% 75%, #22c55e 0%, transparent 50%),
    linear-gradient(160deg,#020617,#020617);
  animation:bgPulse 7s ease-in-out infinite;
  z-index:1;
}
@keyframes bgPulse{
  0%,100%{filter:brightness(1)}
  50%{filter:brightness(1.15)}
}

/* ===== STACK ===== */
.stack{
  position:absolute;
  inset:0;
  z-index:2;
  pointer-events:none;
}

.card{
  position:absolute;
  left:50%;
  top:50%;
  width:78%;
  height:24%;
  background:#0f172a;
  border-radius:16px;
  box-shadow:
    0 18px 40px rgba(0,0,0,.45),
    inset 0 0 0 1px rgba(255,255,255,.08);
  transform:
    translate(-50%,-50%)
    scale(.92);
  opacity:0;
  animation:reveal 8s ease-in-out infinite;
}

/* stagger timing */
.card:nth-child(1){animation-delay:0s}
.card:nth-child(2){animation-delay:1.2s}
.card:nth-child(3){animation-delay:2.4s}
.card:nth-child(4){animation-delay:3.6s}

@keyframes reveal{
  0%{
    opacity:0;
    transform:translate(-50%,-30%) scale(.9);
  }
  15%{
    opacity:1;
    transform:translate(-50%,-50%) scale(1);
  }
  45%{
    opacity:1;
    transform:translate(-50%,-50%) scale(1);
  }
  70%{
    opacity:0;
    transform:translate(-50%,-70%) scale(.96);
  }
  100%{
    opacity:0;
    transform:translate(-50%,-90%) scale(.94);
  }
}

/* ===== VIDEO OPTIONAL ===== */
video{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  opacity:0;
  z-index:3;
  transition:opacity .6s ease;
}
video.show{opacity:1}

/* ===== DEPTH ===== */
.depth{
  position:absolute;
  inset:0;
  box-shadow:
    inset 0 0 150px rgba(0,0,0,.65),
    inset 0 0 320px rgba(0,0,0,.92);
  z-index:4;
  pointer-events:none;
}
</style>
</head>

<body>
<div class="stage">

  <!-- ALWAYS VISIBLE -->
  <div class="bg"></div>

  <!-- RATIONALE STACK -->
  <div class="stack">
    <div class="card"></div>
    <div class="card"></div>
    <div class="card"></div>
    <div class="card"></div>
  </div>

  <!-- VIDEO OPTIONAL -->
  <video id="vid" autoplay muted loop playsinline>
    <source src="SNBT+VO2.webm.mp4" type="video/mp4">
  </video>

  <div class="depth"></div>
</div>

<script>
const v=document.getElementById("vid");

/* LOCKED LOGIC */
v.addEventListener("canplay",()=>{
  v.classList.add("show");
});
v.addEventListener("error",()=>{
  console.log("video fail → rationale visual only");
});
</script>
</body>
</html>
