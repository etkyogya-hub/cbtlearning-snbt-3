<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>CBT Visual Hook</title>

<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">

<style>
html,body{
  margin:0;
  height:100%;
  background:#020617;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
}

.phone{
  width:240px;
  height:480px;
  border-radius:36px;
  position:relative;
  background:linear-gradient(160deg,#0f172a,#020617);
  box-shadow:0 50px 140px rgba(0,0,0,.9);
}
.screen{
  position:absolute;
  inset:12px;
  border-radius:26px;
  overflow:hidden;
  background:#020617;
}

/* CONTENT TEXT */
.content{
  position:absolute;
  top:90px;
  width:100%;
  text-align:center;
  color:#e5e7eb;
  font-size:13px;
  opacity:0;
  transition:.6s ease;
}

/* TITLE */
.title-wrap{
  position:absolute;
  bottom:24px;
  width:100%;
  text-align:center;
}

.title{
  font-family:'Anton',sans-serif;
  font-size:20px;
  letter-spacing:1px;
  position:absolute;
  width:100%;
  left:0;
  opacity:0;
  transition:.6s ease;
}

.solid{
  color:#fff;
  text-shadow:0 0 14px rgba(255,255,255,.6);
  z-index:3;
}

.ghost{
  color:#93c5fd;
  opacity:.6;
  filter:blur(1px);
  z-index:2;
}

.ghost span{
  display:inline-block;
  animation:sukma 2.4s ease-out forwards;
}

@keyframes sukma{
  to{
    transform:
      translate(
        calc(-18px + 36px * var(--x)),
        calc(-22px + 44px * var(--y))
      )
      scale(1.8);
    opacity:0;
  }
}
</style>
</head>

<body>

<div class="phone">
  <div class="screen">

    <div class="content" id="content">
      CBT ≠ Hafalan<br>
      Ini cara membaca jebakan soal
    </div>

    <div class="title-wrap">
      <div class="title solid" id="solidTitle">SNBT – HARD REASONING</div>
      <div class="title ghost" id="ghostTitle">SNBT – HARD REASONING</div>
    </div>

  </div>
</div>

<script>
const ghost=document.getElementById("ghostTitle");
const solid=document.getElementById("solidTitle");
const content=document.getElementById("content");

const text=ghost.innerText;
ghost.innerHTML="";

text.split("").forEach(ch=>{
  const s=document.createElement("span");
  s.textContent = ch === " " ? "\u00A0" : ch;
  s.style.setProperty("--x",Math.random());
  s.style.setProperty("--y",Math.random());
  s.style.animationDelay = (Math.random()*0.6)+"s";
  ghost.appendChild(s);
});

/* TIMELINE */
setTimeout(()=>{
  ghost.style.opacity=1;          // HOOK
},300);

setTimeout(()=>{
  content.style.opacity=1;        // KONFLIK
},2200);

setTimeout(()=>{
  solid.style.opacity=1;          // IDENTITAS / REVEAL
},4200);

setTimeout(()=>{
  content.innerHTML += "<br><br><small>Save kalau sempat kejebak</small>";
},6200);
</script>

</body>
</html>
