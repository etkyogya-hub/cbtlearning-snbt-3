<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>CBT QUIZ TEST</title>

<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  background:#000;
  color:#fff;
  font-family: Arial, Helvetica, sans-serif;
}

.stage{
  width:100vw;
  height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:20px;
}

/* BIG CLEAR TEXT */
.quiz{
  font-size:48px;
  font-weight:900;
  letter-spacing:4px;
}

.question{
  width:90%;
  border:2px solid #fff;
  padding:16px;
  font-size:18px;
  text-align:center;
}

.option{
  width:85%;
  border:2px solid #fff;
  padding:12px;
  font-size:18px;
  text-align:left;
}
</style>
</head>

<body>
<div class="stage">

  <div class="quiz">QUIZ</div>

  <div class="question">
    Soal CBT – contoh tampilan
  </div>

  <div class="option">A. Pilihan pertama</div>
  <div class="option">B. Pilihan kedua</div>
  <div class="option">C. Pilihan ketiga</div>

</div>
</body>
</html>
