<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>CBT Chaos Trigger</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  background:#000;
  overflow:hidden;
  font-family:Arial, Helvetica, sans-serif;
}
#stage{
  position:relative;
  width:100%;
  height:100%;
}
.item{
  position:absolute;
  color:#fff;
  font-weight:700;
  animation: fly 1.8s linear forwards;
  opacity:0;
  white-space:nowrap;
}
@keyframes fly{
  0%{
    transform:translate(var(--x),var(--y)) scale(0.2) rotate(var(--r));
    opacity:0;
  }
  10%{opacity:1;}
  100%{
    transform:translate(0,0) scale(1.8) rotate(0deg);
    opacity:0;
  }
}
.center{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:6vw;
  text-align:center;
}
.flash{
  animation: flash 0.25s steps(1) infinite;
}
@keyframes flash{
  50%{opacity:0;}
}
</style>
</head>
<body>

<div id="stage"></div>

<script>
const stage = document.getElementById("stage");

const CHAOS = [
  // 1️⃣ NUMERIC BLAST
  ["3","7","11","?","∑","x²","≠","→"],

  // 2️⃣ LOGIC SYMBOL
  ["P → Q","Q","¬P","∴ ?","∀","∃","∧","∨"],

  // 3️⃣ CBT OPTIONS
  ["A","B","C","D","SALAH","JEBakan","LOGIKA"],

  // 4️⃣ MIXED FORMULA
  ["2x+3=7","x=?","≠","Δ","√","÷","×"],

  // 5️⃣ PRESSURE WORD
  ["JANGAN","CEPAT","SALAH","CBT","UJIAN"]
];

const pick = CHAOS[Math.floor(Math.random()*CHAOS.length)];

pick.forEach(text=>{
  const el=document.createElement("div");
  el.className="item";
  el.textContent=text;
  el.style.fontSize=(Math.random()*3+2)+"vw";
  el.style.setProperty("--x",(Math.random()*200-100)+"vw");
  el.style.setProperty("--y",(Math.random()*200-100)+"vh");
  el.style.setProperty("--r",(Math.random()*360)+"deg");
  stage.appendChild(el);
});

setTimeout(()=>{
  stage.innerHTML = `
    <div class="center flash">80% SALAH DI SINI</div>
  `;
},1600);
</script>

</body>
</html>
