<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CBTEXAM – Trap Logic Challenge</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
html, body {
  margin: 0;
  padding: 0;
  background: black;
  color: white;
  font-family: Arial, sans-serif;
  overflow: hidden;
}

.screen {
  position: absolute;
  width: 100%;
  height: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
  opacity: 0;
  transition: opacity 0.5s;
  padding: 20px;
}

.active { opacity: 1; }

.big { font-size: 2.3em; font-weight: bold; }
.medium { font-size: 1.5em; }
.small { font-size: 1em; opacity: 0.7; }

.glitch {
  animation: shake 0.15s infinite;
}

@keyframes shake {
  0% { transform: translate(0); }
  25% { transform: translate(-2px, 2px); }
  50% { transform: translate(2px, -2px); }
  75% { transform: translate(-2px, -2px); }
  100% { transform: translate(2px, 2px); }
}

.countdown {
  font-size: 3em;
  color: red;
}
</style>
</head>
<body>

<div id="s1" class="screen active">
  <div class="big glitch">98% ORANG SALAH DI SOAL INI</div>
</div>

<div id="s2" class="screen">
  <div class="medium">Jangan jawab cepat.</div>
</div>

<div id="s3" class="screen">
  <div class="countdown" id="count">5</div>
</div>

<div id="s4" class="screen">
  <div class="big">
    Jika semua A adalah B<br>
    dan semua B adalah C,<br><br>
    apakah semua A adalah C?
  </div>
</div>

<div id="s5" class="screen">
  <div class="medium">Jawaban di akhir.</div>
</div>

<div id="s6" class="screen">
  <div class="big">YA ✅</div>
  <div class="small">Ini silogisme valid.</div>
</div>

<div id="s7" class="screen">
  <div class="medium">Mau lanjut level berikutnya?</div>
  <div class="small">Follow CBTEXAM</div>
</div>

<script>
const screens = ["s1","s2","s3","s4","s5","s6","s7"];
let i = 0;

function showNext() {
  if (i > 0) document.getElementById(screens[i-1]).classList.remove("active");
  if (i < screens.length) {
    document.getElementById(screens[i]).classList.add("active");
  }
  i++;
}

showNext();

setTimeout(showNext, 2000);
setTimeout(showNext, 4000);

let c = 5;
const interval = setInterval(() => {
  const el = document.getElementById("count");
  if (!el) return;
  el.innerText = c;
  c--;
  if (c < 0) clearInterval(interval);
}, 1000);

setTimeout(showNext, 9000);
setTimeout(showNext, 14000);
setTimeout(showNext, 18000);
setTimeout(showNext, 23000);
</script>

</body>
</html>
