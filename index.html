<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>CBT Quiz Cascade</title>

<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#020617;
}

/* ===== STAGE ===== */
.stage{
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;
}

/* ===== BACKGROUND MOTION (ANTI HITAM) ===== */
.bg{
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 20% 30%, #38bdf8 0%, transparent 45%),
    radial-gradient(circle at 80% 70%, #22c55e 0%, transparent 50%),
    linear-gradient(160deg,#020617,#020617);
  animation:bgMove 6s ease-in-out infinite;
  z-index:1;
}
@keyframes bgMove{
  0%,100%{filter:brightness(1)}
  50%{filter:brightness(1.18)}
}

/* ===== QUIZ CARD CASCADE ===== */
.cascade{
  position:absolute;
  inset:0;
  z-index:2;
  pointer-events:none;
}

.card{
  position:absolute;
  left:50%;
  width:78%;
  height:22%;
  background:#0f172a;
  border-radius:14px;
  box-shadow:
    0 20px 40px rgba(0,0,0,.45),
    inset 0 0 0 1px rgba(255,255,255,.08);
  transform:
    translateX(-50%)
    translateY(120vh)
    scale(.92);
  opacity:0;
  animation:drop 6s ease-in-out infinite;
}

/* stagger illusion */
.card:nth-child(1){animation-delay:0s}
.card:nth-child(2){animation-delay:.6s}
.card:nth-child(3){animation-delay:1.2s}
.card:nth-child(4){animation-delay:1.8s}
.card:nth-child(5){animation-delay:2.4s}

@keyframes drop{
  0%{
    transform:translateX(-50%) translateY(120vh) scale(.9);
    opacity:0;
  }
  20%{
    opacity:1;
  }
  45%{
    transform:translateX(-50%) translateY(18vh) scale(1);
    opacity:1;
  }
  70%{
    transform:translateX(-50%) translateY(8vh) scale(.98);
    opacity:1;
  }
  100%{
    transform:translateX(-50%) translateY(-40vh) scale(.95);
    opacity:0;
  }
}

/* ===== OPTIONAL VIDEO LAYER ===== */
video{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  opacity:0;
  z-index:3;
  transition:opacity .6s ease;
}
video.show{opacity:1}

/* ===== DEPTH ===== */
.depth{
  position:absolute;
  inset:0;
  box-shadow:
    inset 0 0 140px rgba(0,0,0,.65),
    inset 0 0 300px rgba(0,0,0,.9);
  z-index:4;
  pointer-events:none;
}
</style>
</head>

<body>
<div class="stage">

  <!-- ALWAYS ON -->
  <div class="bg"></div>

  <!-- CASCADE -->
  <div class="cascade">
    <div class="card"></div>
    <div class="card"></div>
    <div class="card"></div>
    <div class="card"></div>
    <div class="card"></div>
  </div>

  <!-- VIDEO OPTIONAL -->
  <video id="vid" autoplay muted loop playsinline>
    <source src="SNBT+VO2.webm.mp4" type="video/mp4">
  </video>

  <div class="depth"></div>
</div>

<script>
const v=document.getElementById("vid");

/* LOCK: video hanya tampil jika siap */
v.addEventListener("canplay",()=>{
  v.classList.add("show");
});

/* kalau gagal → cascade tetap jalan */
v.addEventListener("error",()=>{
  console.log("video fail, cascade only");
});
</script>
</body>
</html>
