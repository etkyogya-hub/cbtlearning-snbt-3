<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SNBT LOGIKA FIGURAL – HIMPUNAN VARIASI</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#000;font-family:Segoe UI,sans-serif;display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden;color:#fff}
.phone{width:360px;height:640px;background:#0b0b0b;border-radius:38px;position:relative;overflow:hidden;box-shadow:0 0 30px rgba(0,0,0,.7);border:4px solid #3399ff}
.screen{position:absolute;inset:0;padding:20px;display:none;flex-direction:column;align-items:center}
.screen.active{display:flex}
.hook{font-size:22px;font-weight:900;text-align:center;margin-top:20px;animation:shake .1s 6 alternate,colorchange .2s infinite alternate}
@keyframes shake{0%{transform:translateX(0)}20%{transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-2px)}80%{transform:translateX(2px)}100%{transform:translateX(0)}}
@keyframes colorchange{0%{color:#ff5555}25%{color:#55ff55}50%{color:#5555ff}75%{color:#ffff55}100%{color:#ff55ff}}
.level{position:absolute;top:14px;left:18px;font-size:12px;opacity:.55;letter-spacing:.5px;color:#ccc}
.soal-container{display:flex;flex-direction:column;align-items:center;gap:20px;margin-top:20px}
.himpunan-row{display:flex;gap:10px;justify-content:center}
.kotak{width:90px;height:90px;background:#1f1f1f;border:2px solid #fff;border-radius:6px;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:3px}
.kotak-empty{border-style:dashed;font-size:20px;display:flex;align-items:center;justify-content:center}
.shape{width:18px;height:18px;background:#fff}
.circle{border-radius:50%}
.triangle-right{width:0;height:0;border-left:18px solid #fff;border-top:9px solid transparent;border-bottom:9px solid transparent}
.triangle-isosceles{width:0;height:0;border-left:9px solid transparent;border-right:9px solid transparent;border-bottom:18px solid #fff}
.rectangle{width:18px;height:9px}
.rectangle-striped{width:18px;height:9px;background:repeating-linear-gradient(45deg,#fff 0 2px,transparent 2px 4px)}
.half-circle{width:18px;height:9px;background:#fff;border-radius:9px 9px 0 0}
.trapezoid{width:18px;height:0;border-bottom:18px solid #fff;border-left:5px solid transparent;border-right:5px solid transparent}
.parallelogram{width:18px;height:9px;background:#fff;transform:skew(20deg)}
.opsi{margin-top:15px;display:flex;gap:8px}
.kotak-op{transform:scale(.8);opacity:0;transition:.35s}
.kotak-op.show{transform:scale(1);opacity:1}
.overlay{margin-top:10px;font-size:12px;opacity:0;transition:.35s;text-align:center}
.overlay.show{opacity:1}
</style>
</head>
<body>
<div class="phone">

<div class="screen active">
  <div class="hook">SNBT LOGIKA FIGURAL<br>HIMPUNAN VARIASI</div>
</div>

<div class="screen">
  <div class="level">LEVEL 1 — PERKALIAN</div>
  <div class="soal-container">
    <div class="himpunan-row">
      <div class="kotak">
        <div class="triangle-right"></div>
        <div class="rectangle"></div>
        <div class="rectangle-striped"></div>
      </div>
      <div class="kotak kotak-empty">?</div>
    </div>
    <div class="opsi">
      <div class="kotak-op"><div class="kotak">
        <div class="triangle-right"></div><div class="rectangle"></div><div class="rectangle-striped"></div>
        <div class="triangle-right"></div><div class="rectangle"></div><div class="rectangle-striped"></div>
      </div></div>
      <div class="kotak-op"><div class="kotak"><div class="triangle-isosceles"></div><div class="rectangle"></div></div></div>
      <div class="kotak-op"><div class="kotak"><div class="rectangle"></div></div></div>
      <div class="kotak-op"><div class="kotak"><div class="triangle-right"></div></div></div>
    </div>
  </div>
  <div class="overlay">×2 = elemen digandakan</div>
</div>

<div class="screen">
  <div class="level">LEVEL 2 — PENJUMLAHAN</div>
  <div class="soal-container">
    <div class="himpunan-row">
      <div class="kotak"><div class="triangle-right"></div><div class="rectangle"></div></div>
      <div class="kotak"><div class="half-circle"></div><div class="rectangle-striped"></div></div>
      <div class="kotak kotak-empty">?</div>
    </div>
    <div class="opsi">
      <div class="kotak-op"><div class="kotak">
        <div class="triangle-right"></div><div class="rectangle"></div>
        <div class="half-circle"></div><div class="rectangle-striped"></div>
      </div></div>
      <div class="kotak-op"><div class="kotak"><div class="triangle-isosceles"></div></div></div>
      <div class="kotak-op"><div class="kotak"><div class="half-circle"></div></div></div>
      <div class="kotak-op"><div class="kotak"><div class="trapezoid"></div></div></div>
    </div>
  </div>
  <div class="overlay">Gabungkan semua elemen</div>
</div>

<div class="screen">
  <div class="level">LEVEL 3 — PERBANDINGAN</div>
  <div class="soal-container">
    <div class="himpunan-row">
      <div class="kotak"><div class="triangle-right"></div><div class="rectangle"></div><div class="rectangle-striped"></div></div>
      <div class="kotak"><div class="half-circle"></div><div class="rectangle"></div><div class="rectangle-striped"></div></div>
      <div class="kotak kotak-empty">?</div>
    </div>
    <div class="opsi">
      <div class="kotak-op"><div class="kotak">
        <div class="triangle-right"></div><div class="rectangle"></div><div class="rectangle-striped"></div>
        <div class="half-circle"></div><div class="rectangle"></div><div class="rectangle-striped"></div>
      </div></div>
      <div class="kotak-op"><div class="kotak"><div class="parallelogram"></div></div></div>
      <div class="kotak-op"><div class="kotak"><div class="half-circle"></div></div></div>
      <div class="kotak-op"><div class="kotak"><div class="triangle-isosceles"></div></div></div>
    </div>
  </div>
  <div class="overlay">Proporsi sama</div>
</div>

</div>

<script>
const screens=[...document.querySelectorAll('.screen')];
let i=0;
function show(n){screens.forEach((s,idx)=>s.classList.toggle('active',idx===n))}
function reset(s){s.querySelectorAll('.kotak-op').forEach(o=>o.classList.remove('show'));const ov=s.querySelector('.overlay');if(ov)ov.classList.remove('show')}
function play(){
  show(i);
  const s=screens[i]; reset(s);
  if(i===0){setTimeout(next,1400);return}
  setTimeout(()=>s.querySelectorAll('.kotak-op').forEach((o,k)=>setTimeout(()=>o.classList.add('show'),200*k)),400);
  setTimeout(()=>{const ov=s.querySelector('.overlay');if(ov)ov.classList.add('show')},1800);
  setTimeout(next,3800);
}
function next(){i++; if(i>=screens.length)i=1; play()}
play();
</script>
</body>
</html>
