<script>
const screen = document.getElementById("screen");
const quizText = document.getElementById("quizText");
const hook = document.getElementById("hook");
const rationale = document.getElementById("rationale");
const video = document.getElementById("video");

/* SPLIT WORD */
function splitWords(el){
  const words = el.innerText.split(" ");
  el.innerHTML = words.map(w=>`<span class="w">${w}</span>`).join(" ");
}
splitWords(quizText);
splitWords(hook);

/* CBT DISTURBANCE */
function disturb(el, strength=12, scale=1.15){
  el.querySelectorAll(".w").forEach((span,i)=>{
    const r = span.getBoundingClientRect();
    const b = screen.getBoundingClientRect();

    const ghost = span.cloneNode(true);
    ghost.className = "word-fly";
    ghost.style.left = r.left - b.left + "px";
    ghost.style.top  = r.top  - b.top  + "px";
    ghost.style.opacity = .9;
    screen.appendChild(ghost);

    const a = Math.random()*Math.PI*2;
    const d = Math.random()*strength + 6;

    setTimeout(()=>{
      ghost.style.transform = `
        translate(${Math.cos(a)*d}px,${Math.sin(a)*d}px)
        scale(${scale})
      `;
    },i*80);

    setTimeout(()=>{
      ghost.style.transform = "translate(0,0) scale(1)";
      ghost.style.opacity = 0;
    },700+i*60);

    setTimeout(()=>ghost.remove(),1400);
  });
}

/* TIMELINE TERKONTROL */
setTimeout(()=>{
  disturb(quizText,10,1.1);
},1200);

setTimeout(()=>{
  disturb(hook,18,1.25);
},2600);

/* TRANSISI RATIONALE = TENANG */
setTimeout(()=>{
  rationale.classList.add("show");
  video.currentTime = 0;
  video.play();
},4200);

setTimeout(()=>{
  video.pause();
},7200);
</script>
