<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>CBT Scatter Visible</title>
<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  /* background checker supaya kelihatan */
  background:
    linear-gradient(45deg,#ccc 25%,transparent 25%),
    linear-gradient(-45deg,#ccc 25%,transparent 25%),
    linear-gradient(45deg,transparent 75%,#ccc 75%),
    linear-gradient(-45deg,transparent 75%,#ccc 75%);
  background-size:40px 40px;
  background-position:0 0,0 20px,20px -20px,-20px 0px;
  overflow:hidden;
}

#text{
  position:absolute;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:Arial, Helvetica, sans-serif;
  font-size:5vw;
  font-weight:900;
  color:#000; /* hitam biar KONTRAS */
}

.char{
  display:inline-block;
  animation: scatter 1.2s ease-in-out forwards;
}

@keyframes scatter{
  0%{transform:translate(0,0);}
  40%{transform:translate(var(--x),var(--y)) scale(1.2);}
  100%{transform:translate(0,0);}
}
</style>
</head>
<body>

<div id="text"></div>

<script>
const sentence = "SOAL INI MENIPU LOGIKA";
const box = document.getElementById("text");

[...sentence].forEach(c=>{
  const s=document.createElement("span");
  s.className="char";
  s.textContent=c;
  s.style.setProperty("--x",(Math.random()*20-10)+"px");
  s.style.setProperty("--y",(Math.random()*20-10)+"px");
  box.appendChild(s);
});
</script>

</body>
</html>
