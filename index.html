<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>CBT Chaos Overlay — Production</title>

<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
}

/* ================= MODE ================= */
/* ubah ke transparent saat PRODUKSI */
body{
  background:#0f172a; /* <<< MODE CEK VISUAL */
  /* background:transparent; */ /* MODE PRODUKSI */
}

/* ================= STAGE ================= */
.stage{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* ================= TEXT ================= */
.text{
  position:relative;
  font-size:5.5vw;
  font-weight:900;
  color:white;
  text-align:center;
  line-height:1.15;
  animation:pulse .7s ease-out 1;
}

/* ================= ZOOM ================= */
@keyframes pulse{
  0%{transform:scale(1)}
  40%{transform:scale(1.18)}
  100%{transform:scale(1)}
}

/* ================= WORD ================= */
.word{
  position:relative;
  display:inline-block;
  margin:0 .2em;
}

/* ================= CHAOS INTERNAL ================= */
.chaos{
  position:absolute;
  left:50%;
  top:50%;
  font-size:.6em;
  opacity:.9;
  transform-origin:center;
  animation:orbit .5s linear infinite;
}

@keyframes orbit{
  from{transform:rotate(0deg) translateX(9px)}
  to{transform:rotate(360deg) translateX(9px)}
}

/* ================= MICRO SHAKE ================= */
.shake{
  animation:shake .2s linear infinite;
}
@keyframes shake{
  0%{transform:translate(0,0)}
  25%{transform:translate(-1px,1px)}
  50%{transform:translate(1px,-1px)}
  75%{transform:translate(-1px,-1px)}
  100%{transform:translate(0,0)}
}
</style>
</head>

<body>

<div class="stage">
  <div class="text" id="text">
    Jika 3x + 5 = 20, berapa x?
  </div>
</div>

<script>
const text = document.getElementById("text");

/* SPLIT */
const words = text.innerText.split(" ");
text.innerHTML="";

words.forEach(w=>{
  const span=document.createElement("span");
  span.className="word";
  span.innerText=w;
  text.appendChild(span);
});

/* INTERNAL CHAOS */
document.querySelectorAll(".word").forEach(word=>{
  ["3","x","+","=","20"].forEach((s,i)=>{
    const c=document.createElement("span");
    c.className="chaos";
    c.innerText=s;
    c.style.animationDelay=(i*0.06)+"s";
    word.appendChild(c);
  });
});

/* SHAKE BURST */
setTimeout(()=>text.classList.add("shake"),300);
setTimeout(()=>text.classList.remove("shake"),950);
</script>

</body>
</html>
