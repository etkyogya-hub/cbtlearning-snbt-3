<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>TES LOGIKA FIGURAL SNBT</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;background:#000;color:#fff;
  font-family:Inter,Segoe UI,sans-serif;
  display:flex;justify-content:center;align-items:center;height:100vh;
}
.phone{
  width:360px;height:640px;background:#0b0b0b;
  border-radius:26px;overflow:hidden;padding:18px 14px;position:relative;
}

/* HOOK */
.hook{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:#000;z-index:10;animation:hideHook 4s forwards;
}
.hook h1{
  font-size:30px;font-weight:900;text-align:center;line-height:1.15;
  animation:shake .14s infinite alternate,colorShift 1s infinite;
}
@keyframes shake{from{transform:translate(-1px,-1px)}to{transform:translate(1px,1px)}}
@keyframes colorShift{
  0%{color:#ff2d2d}25%{color:#ffd600}50%{color:#2dff57}75%{color:#2dd7ff}100%{color:#ff2d2d}
}
@keyframes hideHook{0%,80%{opacity:1}100%{opacity:0;pointer-events:none}}

/* HEADER */
.header{display:flex;justify-content:space-between;align-items:center;margin-top:42px}
.title{font-size:18px;font-weight:800}
.qno{font-size:13px;opacity:.85}

/* SOAL */
.soal{margin-top:28px;display:flex;flex-direction:column;align-items:center;gap:18px}
.row{display:flex;align-items:center;gap:12px}

/* KOTAK */
.kotak{
  width:72px;height:72px;border:2px solid #fff;border-radius:8px;
  background:#141414;display:flex;flex-wrap:wrap;
  align-content:center;justify-content:center;gap:4px
}
.kotak.q{
  border-style:dashed;font-size:26px;font-weight:900;
  align-items:center;justify-content:center
}

/* SHAPES */
.tr-siku{width:0;height:0;border-left:16px solid #fff;border-top:16px solid transparent}
.tr-sama-kaki{width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-bottom:16px solid #fff}
.rect{width:18px;height:8px;background:#fff}
.square{width:12px;height:12px;background:#fff}
.half{width:18px;height:9px;background:#fff;border-radius:9px 9px 0 0}
.trap{width:18px;height:0;border-bottom:16px solid #fff;border-left:5px solid transparent;border-right:5px solid transparent}
.para{width:18px;height:9px;background:#fff;transform:skew(20deg)}

/* ARSIR */
.striped{
  background:repeating-linear-gradient(
    45deg,#fff 0 2px,transparent 2px 4px
  ) !important;
}

/* OPSI */
.opsi{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.opt{display:flex;align-items:center;gap:8px;padding:8px;border:1.5px solid #444;border-radius:10px}
.lab{
  width:26px;height:26px;border-radius:50%;
  border:2px solid #fff;display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:13px
}

/* RATIONALE */
.rat{font-size:13px;opacity:.85;text-align:center;line-height:1.35}
</style>
</head>

<body>
<div class="phone">

  <!-- HOOK -->
  <div class="hook">
    <h1>TES LOGIKA<br>FIGURAL SNBT</h1>
  </div>

  <!-- HEADER -->
  <div class="header">
    <div class="title">Logika Figural</div>
    <div class="qno" id="qno">SOAL 1 / 9</div>
  </div>

  <!-- SOAL -->
  <div class="soal">
    <div class="row" id="row"></div>
    <div class="opsi" id="opsi"></div>
    <div class="rat" id="rat"></div>
  </div>
</div>

<script>
const soal=[
/* 1 – pengulangan visual */
{
  row:[['tr-siku','rect'],['tr-siku','rect'],[]],
  jawaban:[
    ['A',['tr-siku','rect','tr-siku','rect']],
    ['B',['tr-sama-kaki','rect']],
    ['C',['rect','rect']],
    ['D',['para']]
  ],
  rat:'Pola diulang konsisten.'
},
/* 2 – penambahan unsur */
{
  row:[['tr-sama-kaki'],['tr-sama-kaki','rect'],[]],
  jawaban:[
    ['A',['tr-sama-kaki','rect','rect']],
    ['B',['tr-sama-kaki']],
    ['C',['rect']],
    ['D',['trap']]
  ],
  rat:'Setiap kotak bertambah satu unsur.'
},
/* 3 – substitusi bentuk */
{
  row:[['rect'],['square'],[]],
  jawaban:[
    ['A',['half']],
    ['B',['rect']],
    ['C',['square']],
    ['D',['trap']]
  ],
  rat:'Bentuk diganti dengan kategori sejenis.'
},
/* 4 – pengurangan visual */
{
  row:[['rect','rect','rect'],['rect','rect'],[]],
  jawaban:[
    ['A',['rect']],
    ['B',['rect','rect']],
    ['C',['square']],
    ['D',['para']]
  ],
  rat:'Satu unsur dihilangkan tiap langkah.'
},
/* 5 – arsir */
{
  row:[['rect'],['rect striped'],[]],
  jawaban:[
    ['A',['rect striped','rect striped']],
    ['B',['rect']],
    ['C',['square']],
    ['D',['trap']]
  ],
  rat:'Perubahan atribut visual.'
},
/* 6 – kombinasi bentuk */
{
  row:[['tr-siku'],['tr-siku','half'],[]],
  jawaban:[
    ['A',['tr-siku','half','rect']],
    ['B',['tr-siku']],
    ['C',['half']],
    ['D',['para']]
  ],
  rat:'Unsur baru ditambahkan.'
},
/* 7 – konsistensi jenis */
{
  row:[['square','square'],['rect','rect'],[]],
  jawaban:[
    ['A',['half','half']],
    ['B',['square','rect']],
    ['C',['rect']],
    ['D',['trap']]
  ],
  rat:'Jenis bentuk konsisten.'
},
/* 8 – progresi kompleksitas */
{
  row:[['tr-siku'],['tr-siku','rect'],[]],
  jawaban:[
    ['A',['tr-siku','rect','half']],
    ['B',['tr-siku']],
    ['C',['rect']],
    ['D',['para']]
  ],
  rat:'Kompleksitas meningkat.'
},
/* 9 – integrasi akhir */
{
  row:[['rect striped','half'],['rect striped','half','square'],[]],
  jawaban:[
    ['A',['rect striped','half','square','square']],
    ['B',['rect','half']],
    ['C',['square']],
    ['D',['trap']]
  ],
  rat:'Pola akhir terintegrasi.'
}
];

const rowEl=document.getElementById('row');
const opsiEl=document.getElementById('opsi');
const qno=document.getElementById('qno');
const rat=document.getElementById('rat');
let i=0;

function kotak(arr,isQ=false){
  const k=document.createElement('div');
  k.className='kotak'+(isQ?' q':'');
  if(isQ){k.textContent='?';return k;}
  arr.forEach(c=>{
    const s=document.createElement('div');
    s.className=c;
    k.appendChild(s);
  });
  return k;
}
function render(){
  qno.textContent=`SOAL ${i+1} / 9`;
  rowEl.innerHTML='';opsiEl.innerHTML='';rat.textContent=soal[i].rat;
  rowEl.appendChild(kotak(soal[i].row[0]));
  rowEl.appendChild(kotak(soal[i].row[1]));
  rowEl.appendChild(kotak([],true));
  soal[i].jawaban.forEach(o=>{
    const w=document.createElement('div');w.className='opt';
    const l=document.createElement('div');l.className='lab';l.textContent=o[0];
    w.appendChild(l);w.appendChild(kotak(o[1]));opsiEl.appendChild(w);
  });
}
render();
setInterval(()=>{i=(i+1)%9;render();},4200);
</script>
</body>
</html>
