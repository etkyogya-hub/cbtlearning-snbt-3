<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>CBTLearning – Retention Hook</title>

<style>
body{
  margin:0;
  background:#0b0f19;
  font-family:system-ui,Arial;
}
.stage{
  width:100vw;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}
.card{
  width:260px;
  height:460px;
  background:#111827;
  border-radius:28px;
  padding:16px;
  box-sizing:border-box;
  overflow:hidden;
  position:relative;
}
.doc{
  background:#020617;
  border-radius:12px;
  padding:10px;
  color:#e5e7eb;
  font-size:12px;
  line-height:1.6;
  transform:translateY(0);
  animation:scrollFake 6s infinite;
}
.highlight{
  background:rgba(56,189,248,.25);
  animation:blink 2s infinite;
}
@keyframes scrollFake{
  0%{transform:translateY(0)}
  40%{transform:translateY(-12px)}
  60%{transform:translateY(-10px)}
  100%{transform:translateY(0)}
}
@keyframes blink{
  0%,100%{opacity:.3}
  50%{opacity:1}
}
.text{
  position:absolute;
  left:16px;
  bottom:54px;
  font-size:12px;
  color:#e5e7eb;
  opacity:0;
  animation:textIn 6s infinite;
}
@keyframes textIn{
  0%,30%{opacity:0}
  40%,80%{opacity:1}
  100%{opacity:0}
}
.cta{
  position:absolute;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  font-size:11px;
  color:#94a3b8;
  opacity:0;
  animation:ctaIn 6s infinite;
}
@keyframes ctaIn{
  0%,65%{opacity:0}
  75%,90%{opacity:1}
  100%{opacity:0}
}
</style>
</head>

<body>
<div class="stage">
  <div class="card">

    <div class="doc">
      Jika 3x + 5 = 20 maka nilai x adalah…<br><br>
      <span class="highlight">Langkah pertama bukan menghitung.</span><br>
      Banyak peserta langsung lompat ke operasi,<br>
      padahal struktur soalnya belum dibaca.
    </div>

    <div class="text">Kesalahan terjadi sebelum memilih.</div>
    <div class="cta">perhatikan ulang</div>

  </div>
</div>
</body>
</html>
