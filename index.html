<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>FYP Test – Cognitive Shock</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body {
    margin: 0;
    background: #0b0b0f;
    font-family: Arial, Helvetica, sans-serif;
    color: #ffffff;
    overflow: hidden;
  }
  .frame {
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 32px;
    box-sizing: border-box;
  }
  .text {
    font-size: 6vw;
    line-height: 1.3;
    opacity: 0;
    transition: opacity 0.6s ease;
  }
  .show {
    opacity: 1;
  }
  .warn {
    color: #ff4d4d;
    font-weight: bold;
  }
  .emph {
    color: #ffcc00;
    font-weight: bold;
  }
</style>
</head>
<body>

<div class="frame">
  <div id="text" class="text"></div>
</div>

<script>
const slides = [
  { t: 0,  c: "Soal ini kelihatannya<br><span class='emph'>MUDAH</span>" },
  { t: 3,  c: "Lebih dari 70% peserta<br>menjawab dengan percaya diri" },
  { t: 7,  c: "Jawabannya?<br><span class='emph'>BANYAK YANG BENAR</span>" },
  { t: 12, c: "Tapi masalahnya<br><span class='warn'>BUKAN DI JAWABAN</span>" },
  { t: 17, c: "Masalahnya ada di<br><span class='warn'>CARA BERPIKIR</span>" },
  { t: 23, c: "Kesalahan ini tidak terasa sekarang" },
  { t: 28, c: "Ia muncul di soal berikutnya" },
  { t: 33, c: "Dan di ujian nyata<br>kesalahan kecil = gagal" },
  { t: 38, c: "<span class='warn'>Ujian tidak menilai tebakan</span>" },
  { t: 42, c: "Ia menilai<br><span class='emph'>ALASAN</span>" }
];

const el = document.getElementById("text");

slides.forEach(slide => {
  setTimeout(() => {
    el.classList.remove("show");
    setTimeout(() => {
      el.innerHTML = slide.c;
      el.classList.add("show");
    }, 300);
  }, slide.t * 1000);
});
</script>

</body>
</html>
