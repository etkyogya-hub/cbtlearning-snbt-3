<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>CBT Visual Hook</title>

<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">

<style>
html,body{
  margin:0;
  height:100%;
  background:#020617;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
}

/* MOCKUP HP */
.phone{
  width:240px;
  height:480px;
  border-radius:36px;
  position:relative;
  background:linear-gradient(160deg,#0f172a,#020617);
  box-shadow:0 50px 140px rgba(0,0,0,.9);
}
.phone::before{
  content:"";
  position:absolute;
  inset:-3px;
  border-radius:38px;
  background:linear-gradient(
    180deg,
    transparent,
    rgba(56,189,248,.5),
    transparent
  );
  opacity:.5;
}

/* SCREEN */
.screen{
  position:absolute;
  inset:12px;
  border-radius:26px;
  overflow:hidden;
  background:#020617;
}

/* TITLE */
.title-wrap{
  position:absolute;
  bottom:22px;
  width:100%;
  text-align:center;
  pointer-events:none;
}

.title{
  font-family:'Anton',sans-serif;
  font-size:20px;
  letter-spacing:1px;
  position:absolute;
  width:100%;
  left:0;
}

/* TITLE STAY */
.solid{
  color:#ffffff;
  text-shadow:0 0 14px rgba(255,255,255,.6);
  z-index:3;
}

/* SUKMA */
.ghost{
  z-index:2;
  color:#93c5fd;
  opacity:.45;
  filter:blur(1.2px);
}

.ghost span{
  display:inline-block;
  animation:sukma 2.8s ease-in-out infinite;
}

@keyframes sukma{
  0%{
    transform:translate(0,0) scale(1);
    opacity:.45;
  }
  45%{
    transform:
      translate(
        calc(-14px + 28px * var(--x)),
        calc(-18px + 36px * var(--y))
      )
      scale(1.6);
    opacity:0;
  }
  100%{
    transform:translate(0,0) scale(1);
    opacity:.45;
  }
}

/* ISI (BIAR ADA KONTEKS, TIDAK PUTIH) */
.content{
  position:absolute;
  top:80px;
  width:100%;
  text-align:center;
  color:#e5e7eb;
  font-size:13px;
  opacity:.9;
}
</style>
</head>

<body>

<div class="phone">
  <div class="screen">

    <div class="content">
      CBT ≠ Hafalan<br>
      Ini cara membaca soal
    </div>

    <div class="title-wrap">
      <div class="title solid">SNBT – HARD REASONING</div>
      <div class="title ghost" id="ghostTitle">
        SNBT – HARD REASONING
      </div>
    </div>

  </div>
</div>

<script>
const ghost=document.getElementById("ghostTitle");
const text=ghost.innerText;
ghost.innerHTML="";

text.split("").forEach(ch=>{
  const s=document.createElement("span");
  s.textContent = ch === " " ? "\u00A0" : ch;
  s.style.setProperty("--x",Math.random());
  s.style.setProperty("--y",Math.random());
  s.style.animationDelay = (Math.random()*2.4)+"s";
  s.style.animationDuration = (2.6+Math.random()*2.8)+"s";
  ghost.appendChild(s);
});
</script>

</body>
</html>
