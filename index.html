<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<title>Professional Phone Mockup – TikTok</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  height:100%;
  background:#000;
  overflow:hidden;
  font-family:'Anton',system-ui,sans-serif;
}

/* STAGE */
.stage{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* PHONE SCALE SYSTEM */
.phone-wrap{
  width:min(420px, 92vw);
  aspect-ratio:9/19.5;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* PHONE BODY – REAL 3D */
.phone{
  width:100%;
  height:100%;
  position:relative;
  border-radius:48px;
  background:
    linear-gradient(145deg,#1e3c72,#2a5298);
  box-shadow:
    0 40px 90px rgba(0,0,0,.75),
    inset 0 0 0 2px rgba(255,255,255,.06);
  padding:14px;
  transform:
    perspective(1200px)
    rotateX(6deg)
    rotateY(-6deg);
}

/* SIDE SHINE */
.phone::before{
  content:"";
  position:absolute;
  inset:0;
  border-radius:48px;
  background:
    linear-gradient(
      120deg,
      rgba(255,255,255,.25),
      transparent 40%
    );
  pointer-events:none;
}

/* SCREEN – NORMAL PHONE SCREEN */
.screen{
  width:100%;
  height:100%;
  border-radius:36px;
  overflow:hidden;
  background:#000;
  position:relative;
}

/* VIDEO */
video{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* OVERLAY */
.overlay{
  position:absolute;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  padding-top:14%;
  pointer-events:none;
}

/* HOOK – BIG → FIT → STAY */
#hook{
  font-size:clamp(28px,4vw,38px);
  color:#fff;
  text-align:center;
  letter-spacing:1px;
  animation:hookPro 6s ease-out forwards;
}

@keyframes hookPro{
  0%{
    transform:scale(1.55);
    opacity:1;
  }
  18%{
    transform:scale(1.25) translateX(-10px);
  }
  36%{
    transform:scale(1.12) translateX(10px);
  }
  55%{
    transform:scale(1);
  }
  100%{
    transform:scale(1);
    opacity:1;
  }
}

/* CTA */
#cta{
  position:absolute;
  bottom:12%;
  width:100%;
  text-align:center;
  font-size:18px;
  color:#fff;
  opacity:0;
  animation:ctaIn 1.2s ease forwards;
  animation-delay:12s;
}

@keyframes ctaIn{
  from{opacity:0; transform:translateY(20px)}
  to{opacity:1; transform:translateY(0)}
}
</style>
</head>

<body>

<div class="stage">
  <div class="phone-wrap">
    <div class="phone">
