<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>CBT Internal Scatter</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  background:#000;
  overflow:hidden;
  font-family:Arial, Helvetica, sans-serif;
}
#wrap{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  transform:scale(1.15);
  animation: zoomOut 1.6s ease-out forwards;
}
@keyframes zoomOut{
  to{transform:scale(1);}
}

.word{
  font-size:5vw;
  font-weight:900;
  color:#fff;
  letter-spacing:0.1em;
}

.char{
  display:inline-block;
  animation: scatter 1.6s ease-in-out forwards;
}

@keyframes scatter{
  0%{
    transform:translate(0,0) scale(1);
    opacity:1;
  }
  30%{
    transform:
      translate(calc(var(--x)*0.6), calc(var(--y)*0.6))
      rotate(var(--r))
      scale(1.2);
  }
  60%{
    transform:
      translate(calc(var(--x)), calc(var(--y)))
      rotate(var(--r))
      scale(0.9);
    opacity:1;
  }
  100%{
    transform:translate(0,0) scale(1);
    opacity:0.85;
  }
}
</style>
</head>
<body>

<div id="wrap">
  <div id="text" class="word"></div>
</div>

<script>
const sentence = "SOAL INI MENIPU LOGIKA";
const container = document.getElementById("text");

[...sentence].forEach(char=>{
  const span = document.createElement("span");
  span.className = "char";
  span.textContent = char;
  span.style.setProperty("--x",(Math.random()*40-20)+"px");
  span.style.setProperty("--y",(Math.random()*40-20)+"px");
  span.style.setProperty("--r",(Math.random()*30-15)+"deg");
  span.style.animationDelay = (Math.random()*0.2)+"s";
  container.appendChild(span);
});
</script>

</body>
</html>
