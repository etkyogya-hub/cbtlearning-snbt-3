<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SNBT FIGURAL – EXAM MODE</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;background:#000;
  display:flex;justify-content:center;align-items:center;
  height:100vh;font-family:Segoe UI,Arial,sans-serif;color:#fff;
}
.phone{
  width:360px;height:640px;
  background:#0b0b0b;
  border-radius:36px;
  border:4px solid #3399ff;
  box-shadow:0 0 40px rgba(0,0,0,.9);
  overflow:hidden;position:relative;
}
.screen{
  position:absolute;inset:0;
  padding:16px;
  display:flex;flex-direction:column;align-items:center;
}
.hook{
  font-size:22px;font-weight:900;text-align:center;
  margin-top:14px;
  animation:shake .12s infinite alternate,color .3s infinite alternate;
}
@keyframes shake{from{transform:translateX(-2px)}to{transform:translateX(2px)}}
@keyframes color{
  0%{color:#ff4d4d}25%{color:#4dff4d}
  50%{color:#4d4dff}75%{color:#ffff4d}100%{color:#ff4dff}
}
.timer{
  margin-top:6px;font-size:14px;opacity:.8;
}
.row{
  margin-top:18px;display:flex;gap:12px;
}
.box{
  width:92px;height:92px;
  background:#1c1c1c;
  border:2px solid #fff;border-radius:6px;
  display:flex;justify-content:center;align-items:center;
}
.box.q{
  border-style:dashed;font-size:28px;font-weight:700;
}
.options{
  margin-top:18px;
  display:grid;grid-template-columns:1fr 1fr;gap:12px;
}
.opt{display:flex;flex-direction:column;align-items:center}
.lbl{font-size:12px;opacity:.7}
svg{width:72px;height:72px}
.rationale{
  margin-top:10px;
  font-size:12px;line-height:1.4;
  opacity:0;transition:.4s;
  text-align:center;
}
.rationale.show{opacity:1}
.cta{
  position:absolute;bottom:18px;
  font-size:14px;font-weight:700;
  opacity:0;transition:.4s;
  animation:pulse 1s infinite alternate;
}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.08)}}
</style>
</head>

<body>
<div class="phone">
<div class="screen">

<div class="hook">LOGIKA FIGURAL SNBT</div>
<div class="timer">EXAM MODE · 7 detik</div>

<!-- SOAL KOMPOSISI -->
<div class="row">
  <!-- A -->
  <div class="box">
    <svg viewBox="0 0 100 100">
      <polygon points="10,80 60,20 60,80" fill="#fff"/>
      <rect x="62" y="20" width="10" height="60" fill="#fff"/>
      <rect x="74" y="20" width="10" height="60" fill="url(#h1)"/>
      <defs>
        <pattern id="h1" width="4" height="4" patternUnits="userSpaceOnUse">
          <rect width="2" height="4" fill="#fff"/>
        </pattern>
      </defs>
    </svg>
  </div>

  <!-- B (rotasi + pertukaran atribut) -->
  <div class="box">
    <svg viewBox="0 0 100 100" transform="rotate(90)">
      <polygon points="10,80 60,20 60,80" fill="#fff"/>
      <rect x="62" y="20" width="10" height="60" fill="url(#h2)"/>
      <rect x="74" y="20" width="10" height="60" fill="#fff"/>
      <defs>
        <pattern id="h2" width="4" height="4" patternUnits="userSpaceOnUse">
          <rect width="2" height="4" fill="#fff"/>
        </pattern>
      </defs>
    </svg>
  </div>

  <!-- ? -->
  <div class="box q">?</div>
</div>

<!-- OPSI -->
<div class="options">

<!-- A (BENAR) -->
<div class="opt">
<div class="box">
<svg viewBox="0 0 100 100" transform="rotate(180)">
  <polygon points="10,80 60,20 60,80" fill="#fff"/>
  <rect x="62" y="20" width="10" height="60" fill="#fff"/>
  <rect x="74" y="20" width="10" height="60" fill="url(#h3)"/>
  <defs>
    <pattern id="h3" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="2" height="4" fill="#fff"/>
    </pattern>
  </defs>
</svg>
</div><div class="lbl">A</div>
</div>

<!-- B -->
<div class="opt"><div class="box">
<svg viewBox="0 0 100 100">
<circle cx="50" cy="50" r="25" fill="#fff"/>
</svg></div><div class="lbl">B</div></div>

<!-- C -->
<div class="opt"><div class="box">
<svg viewBox="0 0 100 100">
<rect x="20" y="20" width="60" height="60" fill="#fff"/>
</svg></div><div class="lbl">C</div></div>

<!-- D -->
<div class="opt"><div class="box">
<svg viewBox="0 0 100 100">
<polygon points="50,10 90,90 10,90" fill="#fff"/>
</svg></div><div class="lbl">D</div></div>

</div>

<!-- RATIONALE -->
<div class="rationale" id="rat">
Pola: figur komposit dipertahankan, setiap langkah terjadi rotasi 90° dan
pertukaran atribut arsiran antar persegi panjang.
Langkah berikutnya = rotasi 180° dengan komposisi tetap.
</div>

<div class="cta" id="cta">FOLLOW · SAVE · PART 2</div>

</div>
</div>

<script>
let t=7;
const timer=document.querySelector('.timer');
const rat=document.getElementById('rat');
const cta=document.getElementById('cta');

const iv=setInterval(()=>{
  t--;
  timer.textContent="EXAM MODE · "+t+" detik";
  if(t===0){
    rat.classList.add('show');
    cta.style.opacity=1;
    clearInterval(iv);
    setTimeout(()=>location.reload(),2500); // LOOP
  }
},1000);
</script>

</body>
</html>
