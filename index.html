<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>CBTLearning Hybrid – SNBT Retention</title>

<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">

<style>
html,body{
  margin:0;
  height:100%;
  background:#020617;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
}

/* ================= PHONE 3D ================= */
.phone{
  width:240px;
  height:480px;
  position:relative;
  border-radius:36px;
  background:linear-gradient(160deg,#0f172a,#020617);
  box-shadow:0 60px 140px rgba(0,0,0,.85);
  transform-style:preserve-3d;
  animation:float 7s ease-in-out infinite;
}
@keyframes float{
  0%,100%{transform:translateY(0) rotateX(3deg) rotateY(-3deg)}
  50%{transform:translateY(-6px) rotateX(5deg) rotateY(-5deg)}
}

/* frame glow (warna berubah tiap soal via JS) */
.phone::before{
  content:"";
  position:absolute;
  inset:-3px;
  border-radius:38px;
  background:linear-gradient(180deg,transparent,rgba(56,189,248,.6),transparent);
  opacity:.55;
  pointer-events:none;
}

/* ================= SCREEN ================= */
.screen{
  position:absolute;
  inset:12px;
  border-radius:26px;
  overflow:hidden;
  background:#000;
}

/* ===== VIDEO BACKGROUND (HYBRID) ===== */
.bgvideo{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  opacity:.85;
}

/* ================= SOAL ================= */
.soal{
  position:absolute;
  top:86px;
  left:7%;
  width:86%;
  font-family:'Anton',sans-serif;
  font-size:22px;
  line-height:1.25;
  text-align:center;
  background:linear-gradient(
    90deg,
    #e0f2fe,
    #38bdf8,
    #818cf8,
    #38bdf8,
    #e0f2fe
  );
  background-size:300% 100%;
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  text-shadow:0 0 14px rgba(255,255,255,.35);
  opacity:0;
}

/* listrik mengalir */
.flow{
  animation:electric 1.4s linear infinite;
}
@keyframes electric{
  0%{background-position:0% 50%}
  100%{background-position:100% 50%}
}

/* rocky */
.shake{
  animation:shake .6s ease-in-out;
}
@keyframes shake{
  0%{transform:translateX(0)}
  25%{transform:translateX(-2px)}
  50%{transform:translateX(2px)}
  75%{transform:translateX(-1px)}
  100%{transform:translateX(0)}
}

/* ================= OPSI ================= */
.opsi{
  position:absolute;
  top:190px;
  left:10%;
  width:80%;
  font-size:13px;
  line-height:1.5;
  color:#e5e7eb;
  opacity:0;
}

/* ================= RATIONALE ================= */
.rationale{
  position:absolute;
  bottom:58px;
  left:8%;
  width:84%;
  font-size:12px;
  color:#fff;
  text-align:center;
  opacity:0;
  text-shadow:0 0 16px rgba(255,255,255,.6);
}

/* ================= CTA (AKHIR SAJA) ================= */
.cta{
  position:absolute;
  bottom:100px;
  width:100%;
  text-align:center;
  font-size:14px;
  font-weight:700;
  color:#e0f2fe;
  opacity:0;
  text-shadow:0 0 20px rgba(56,189,248,.8);
}

/* ================= CONTROL ================= */
.show{opacity:1; transition:opacity .5s ease}
.separator{
  position:absolute;
  inset:0;
  background:#020617;
  opacity:0;
}
.separator.show{opacity:1}
</style>
</head>

<body>

<div class="phone" id="phone">
  <div class="screen">

    <!-- GANTI video di bawah dengan video demo kamu -->
    <video class="bgvideo" autoplay muted loop playsinline>
      <source src="CBT-Demo.mp4" type="video/mp4">
    </video>

    <div class="soal" id="soal"></div>
    <div class="opsi" id="opsi"></div>
    <div class="rationale" id="rat"></div>
    <div class="cta" id="cta">Coba CBTLearning • Rationale Generator</div>
    <div class="separator" id="sep"></div>

  </div>
</div>

<script>
const data=[
{
q:"Jika 4x − 7 = 21, nilai x adalah …",
o:"A. 5<br>B. 6<br>C. 7<br>D. 8",
r:"Pindahkan konstanta lalu bagi koefisien."
},
{
q:"Makna kata ‘implisit’ adalah …",
o:"A. Tersurat<br>B. Tersembunyi<br>C. Tegas<br>D. Langsung",
r:"Implisit tidak dinyatakan langsung."
},
{
q:"Perbandingan 3 : 4 setara dengan …",
o:"A. 6 : 8<br>B. 4 : 3<br>C. 9 : 10<br>D. 12 : 10",
r:"Kalikan kedua sisi dengan bilangan sama."
},
{
q:"Jika semua P adalah Q dan semua Q adalah R, maka …",
o:"A. Semua R adalah P<br>B. Semua P adalah R<br>C. Sebagian R adalah P<br>D. Tidak ada hubungan",
r:"Silogisme transitif."
},
{
q:"Tujuan utama teks argumentasi adalah …",
o:"A. Menghibur<br>B. Menjelaskan<br>C. Meyakinkan<br>D. Menggambarkan",
r:"Argumentasi berisi pendapat + alasan."
},
{
q:"Rata-rata dari 6, 8, 10 adalah …",
o:"A. 7<br>B. 8<br>C. 9<br>D. 10",
r:"Jumlah dibagi banyak data."
},
{
q:"Peluang muncul angka pada dadu adalah …",
o:"A. 1/2<br>B. 1/3<br>C. 1/6<br>D. 5/6",
r:"Satu kejadian dari enam kemungkinan."
},
{
q:"Kesimpulan sah harus didukung oleh …",
o:"A. Dugaan<br>B. Emosi<br>C. Premis benar<br>D. Mayoritas",
r:"Logika valid = premis kuat."
},
{
q:"Makna kata ‘konsisten’ adalah …",
o:"A. Berubah-ubah<br>B. Tetap<br>C. Acak<br>D. Sementara",
r:"Konsisten = tidak berubah."
}
];

const soal=document.getElementById("soal");
const opsi=document.getElementById("opsi");
const rat=document.getElementById("rat");
const sep=document.getElementById("sep");
const cta=document.getElementById("cta");
const phone=document.getElementById("phone");

let i=0;

function next(){
  sep.classList.remove("show");
  soal.className="soal";
  opsi.className="opsi";
  rat.className="rationale";

  const d=data[i];
  soal.innerHTML=d.q;
  opsi.innerHTML=d.o;
  rat.innerHTML=d.r;

  // warna frame HP acak
  phone.style.background=
    `linear-gradient(160deg,
      hsl(${Math.random()*360},45%,18%),
      #020617)`;

  setTimeout(()=>{
    soal.classList.add("show","flow","shake");
  },300);

  setTimeout(()=>{
    opsi.classList.add("show");
  },900);

  setTimeout(()=>{
    rat.classList.add("show");
  },1700);

  // akhir soal
  setTimeout(()=>{
    sep.classList.add("show");
  },3600);

  // CTA hanya di akhir putaran
  if(i===data.length-1){
    setTimeout(()=>cta.classList.add("show"),3800);
  }

  i=(i+1)%data.length;
  setTimeout(next,4400);
}

next();
</script>

</body>
</html>
