<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SNBT Logika Figural – Operasi Himpunan</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#000;color:#fff;font-family:Segoe UI,sans-serif;display:flex;justify-content:center;align-items:center;height:100vh}
.phone{width:360px;height:640px;background:#0b0b0b;border-radius:26px;overflow:hidden;padding:14px}
.header{display:flex;justify-content:space-between;font-size:11px;opacity:.7}
.soal{margin-top:14px;display:flex;flex-direction:column;align-items:center;gap:14px}
.row{display:flex;align-items:center;gap:8px}
.op{font-size:20px;font-weight:900}
.kotak{width:64px;height:64px;border:1.5px solid #fff;border-radius:6px;background:#1a1a1a;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:3px}
.kotak.q{border-style:dashed;font-size:20px;align-items:center;justify-content:center}

/* SHAPES */
.tr-siku{width:0;height:0;border-left:14px solid #fff;border-top:14px solid transparent}
.tr-sama-kaki{width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-bottom:14px solid #fff}
.tr-sama-sisi{width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-bottom:14px solid #fff;transform:scaleX(1.2)}
.rect{width:14px;height:7px;background:#fff}
.square{width:10px;height:10px;background:#fff}
.half{width:14px;height:7px;background:#fff;border-radius:7px 7px 0 0}
.trap{width:14px;height:0;border-bottom:14px solid #fff;border-left:4px solid transparent;border-right:4px solid transparent}
.para{width:14px;height:7px;background:#fff;transform:skew(20deg)}

.opsi{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%}
.opt{display:flex;gap:6px;align-items:center;border:1px solid #444;border-radius:8px;padding:6px}
.lab{width:22px;height:22px;border-radius:50%;border:1px solid #fff;display:flex;align-items:center;justify-content:center;font-weight:700}
.rat{font-size:11px;opacity:.85;text-align:center}
</style>
</head>
<body>

<div class="phone">
  <div class="header">
    <div>SOAL 1 / 9</div>
    <div>OPERASI HIMPUNAN</div>
  </div>

  <div class="soal">
    <div class="row">
      <div class="kotak">
        <div class="tr-siku"></div>
        <div class="rect"></div>
      </div>
      <div class="op">× 2</div>
      <div class="kotak q">?</div>
    </div>

    <div class="opsi">
      <div class="opt">
        <div class="lab">A</div>
        <div class="kotak">
          <div class="tr-siku"></div><div class="rect"></div>
          <div class="tr-siku"></div><div class="rect"></div>
        </div>
      </div>
      <div class="opt">
        <div class="lab">B</div>
        <div class="kotak">
          <div class="tr-sama-kaki"></div>
          <div class="tr-sama-kaki"></div>
        </div>
      </div>
      <div class="opt">
        <div class="lab">C</div>
        <div class="kotak">
          <div class="rect"></div><div class="rect"></div>
        </div>
      </div>
      <div class="opt">
        <div class="lab">D</div>
        <div class="kotak">
          <div class="para"></div>
        </div>
      </div>
    </div>

    <div class="rat">
      Operasi ×2 berarti **set digandakan tanpa mengubah jenis bangun**.
    </div>
  </div>
</div>

</body>
</html>
