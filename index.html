<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SNBT LOGIKA FIGURAL – HIMPUNAN VARIASI</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#000;
  font-family:Segoe UI,sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  color:#fff;
}

/* MOCKUP = UKURAN LAYAR ASLI */
.phone{
  width:360px;
  height:640px;
  background:#0b0b0b;
  border-radius:28px;
  position:relative;
  overflow:hidden;
}

/* SCREEN */
.screen{
  position:absolute;
  inset:0;
  padding:14px;
  display:none;
  flex-direction:column;
  align-items:center;
}
.screen.active{display:flex}

/* HOOK */
.hook{
  margin-top:120px;
  font-size:20px;
  font-weight:900;
  text-align:center;
  animation:shake .1s 6 alternate,colorchange .2s infinite alternate;
}
@keyframes shake{
  0%{transform:translateX(0)}
  50%{transform:translateX(-3px)}
  100%{transform:translateX(3px)}
}
@keyframes colorchange{
  0%{color:#ff5555}
  50%{color:#55ff55}
  100%{color:#5555ff}
}

/* LEVEL */
.level{
  font-size:11px;
  opacity:.6;
  margin-top:6px;
}

/* SOAL */
.soal-container{
  margin-top:20px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:16px;
}

/* HIMPUNAN ROW */
.himpunan-row{
  display:flex;
  align-items:center;
  gap:10px;
}

/* OPERATOR */
.operator{
  font-size:22px;
  font-weight:900;
  opacity:.8;
}

/* KOTAK HIMPUNAN (DIPERKECIL) */
.kotak{
  width:64px;
  height:64px;
  background:#1a1a1a;
  border:1.5px solid #fff;
  border-radius:6px;
  display:flex;
  flex-wrap:wrap;
  align-content:center;
  justify-content:center;
  gap:3px;
}
.kotak-empty{
  border-style:dashed;
  font-size:18px;
}

/* SHAPE (DISKALAKAN) */
.shape{background:#fff}
.triangle-right{
  width:0;height:0;
  border-left:14px solid #fff;
  border-top:7px solid transparent;
  border-bottom:7px solid transparent;
}
.triangle-isosceles{
  width:0;height:0;
  border-left:7px solid transparent;
  border-right:7px solid transparent;
  border-bottom:14px solid #fff;
}
.rectangle{width:14px;height:7px}
.rectangle-striped{
  width:14px;height:7px;
  background:repeating-linear-gradient(45deg,#fff 0 2px,transparent 2px 4px)
}
.half-circle{
  width:14px;height:7px;
  background:#fff;
  border-radius:7px 7px 0 0;
}
.trapezoid{
  width:14px;height:0;
  border-bottom:14px solid #fff;
  border-left:4px solid transparent;
  border-right:4px solid transparent;
}
.parallelogram{
  width:14px;height:7px;
  background:#fff;
  transform:skew(20deg);
}

/* OPSI */
.opsi{
  display:flex;
  gap:8px;
  margin-top:6px;
}
.kotak-op{
  transform:scale(.9);
  opacity:0;
  transition:.3s;
}
.kotak-op.show{
  opacity:1;
  transform:scale(1);
}

/* OVERLAY */
.overlay{
  margin-top:8px;
  font-size:11px;
  opacity:0;
  transition:.3s;
  text-align:center;
}
.overlay.show{opacity:1}
</style>
</head>
<body>

<div class="phone">

<!-- HOOK -->
<div class="screen active">
  <div class="hook">SNBT LOGIKA FIGURAL<br>HIMPUNAN VARIASI</div>
</div>

<!-- LEVEL 1 -->
<div class="screen">
  <div class="level">LEVEL 1 — PERKALIAN HIMPUNAN</div>
  <div class="soal-container">
    <div class="himpunan-row">
      <div class="kotak">
        <div class="triangle-right"></div>
        <div class="rectangle"></div>
        <div class="rectangle-striped"></div>
      </div>
      <div class="operator">× 2 =</div>
      <div class="kotak kotak-empty">?</div>
    </div>
    <div class="opsi">
      <div class="kotak-op"><div class="kotak">
        <div class="triangle-right"></div><div class="rectangle"></div><div class="rectangle-striped"></div>
        <div class="triangle-right"></div><div class="rectangle"></div><div class="rectangle-striped"></div>
      </div></div>
      <div class="kotak-op"><div class="kotak"><div class="triangle-isosceles"></div></div></div>
      <div class="kotak-op"><div class="kotak"><div class="rectangle"></div></div></div>
    </div>
  </div>
  <div class="overlay">Perkalian = duplikasi elemen</div>
</div>

<!-- LEVEL 2 -->
<div class="screen">
  <div class="level">LEVEL 2 — PENJUMLAHAN HIMPUNAN</div>
  <div class="soal-container">
    <div class="himpunan-row">
      <div class="kotak">
        <div class="triangle-right"></div>
        <div class="rectangle"></div>
      </div>
      <div class="operator">+</div>
      <div class="kotak">
        <div class="half-circle"></div>
        <div class="rectangle-striped"></div>
      </div>
      <div class="operator">=</div>
      <div class="kotak kotak-empty">?</div>
    </div>
    <div class="opsi">
      <div class="kotak-op"><div class="kotak">
        <div class="triangle-right"></div>
        <div class="rectangle"></div>
        <div class="half-circle"></div>
        <div class="rectangle-striped"></div>
      </div></div>
      <div class="kotak-op"><div class="kotak"><div class="trapezoid"></div></div></div>
    </div>
  </div>
  <div class="overlay">Penjumlahan = gabungan elemen</div>
</div>

<!-- LEVEL 3 -->
<div class="screen">
  <div class="level">LEVEL 3 — PERBANDINGAN PROPORSI</div>
  <div class="soal-container">
    <div class="himpunan-row">
      <div class="kotak">
        <div class="triangle-right"></div>
        <div class="rectangle"></div>
        <div class="rectangle-striped"></div>
      </div>
      <div class="operator">:</div>
      <div class="kotak">
        <div class="half-circle"></div>
        <div class="rectangle"></div>
        <div class="rectangle-striped"></div>
      </div>
      <div class="operator">=</div>
      <div class="kotak kotak-empty">?</div>
    </div>
    <div class="opsi">
      <div class="kotak-op"><div class="kotak">
        <div class="triangle-right"></div>
        <div class="rectangle"></div>
        <div class="rectangle-striped"></div>
        <div class="half-circle"></div>
        <div class="rectangle"></div>
        <div class="rectangle-striped"></div>
      </div></div>
      <div class="kotak-op"><div class="kotak"><div class="parallelogram"></div></div></div>
    </div>
  </div>
  <div class="overlay">Proporsi jumlah & jenis sama</div>
</div>

</div>

<script>
const screens=[...document.querySelectorAll('.screen')];
let i=0;
function show(n){screens.forEach((s,idx)=>s.classList.toggle('active',idx===n))}
function reset(s){
  s.querySelectorAll('.kotak-op').forEach(o=>o.classList.remove('show'));
  const ov=s.querySelector('.overlay'); if(ov)ov.classList.remove('show');
}
function play(){
  show(i);
  const s=screens[i]; reset(s);
  if(i===0){setTimeout(next,1400);return}
  setTimeout(()=>s.querySelectorAll('.kotak-op').forEach((o,k)=>setTimeout(()=>o.classList.add('show'),180*k)),400);
  setTimeout(()=>{const ov=s.querySelector('.overlay');if(ov)ov.classList.add('show')},1600);
  setTimeout(next,3600);
}
function next(){i++; if(i>=screens.length)i=1; play()}
play();
</script>

</body>
</html>
