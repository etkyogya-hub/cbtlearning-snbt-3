<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Phone Mockup Blue Screen</title>

<style>
html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  background:#000;
  overflow:hidden;
  display:flex;
  justify-content:center;
  align-items:center;
}

/* PHONE BODY */
.phone{
  width:360px;
  height:720px;
  background:#111;
  border-radius:42px;
  box-shadow:0 30px 80px rgba(0,0,0,.7);
  position:relative;
  transform:perspective(900px) rotateX(5deg) rotateY(-5deg);
}

/* SCREEN (BLUE BACKGROUND) */
.screen{
  position:absolute;
  inset:10px;
  border-radius:34px;
  background:linear-gradient(180deg,#1e3c72,#2a5298);
  overflow:hidden;
}

/* VIDEO */
video{
  width:100%;
  height:100%;
  object-fit:cover;
  mix-blend-mode:screen;
}

/* OVERLAY COMMON */
.overlay{
  position:absolute;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  pointer-events:none;
  font-family:'Anton',sans-serif;
}

/* HOOK SHAKY */
#hook{
  font-size:32px;
  color:#fff;
  opacity:0;
  animation:hookShake 2s ease-out forwards;
}
@keyframes hookShake{
  0%{opacity:0;transform:scale(1.4) translateX(-12px);}
  10%{opacity:1;transform:scale(1.25) translateX(12px);}
  20%{transform:scale(1.18) translateX(-8px);}
  30%{transform:scale(1.1) translateX(6px);}
  50%{transform:scale(1) translateX(0);}
  100%{opacity:0;}
}

/* TENSION */
#tension{
  position:absolute;
  bottom:22%;
  font-size:16px;
  color:#e6f0ff;
  opacity:0;
  animation:tensionFade 4s ease forwards;
  animation-delay:5s;
}
@keyframes tensionFade{
  0%{opacity:0}
  20%{opacity:1}
  80%{opacity:1}
  100%{opacity:0}
}

/* CTA */
#cta{
  position:absolute;
  bottom:14%;
  font-size:18px;
  color:white;
  opacity:0;
  animation:ctaIn 1.2s ease forwards;
  animation-delay:13.5s;
}
@keyframes ctaIn{
  from{opacity:0;transform:translateY(20px)}
  to{opacity:1;transform:translateY(0)}
}
</style>
</head>

<body>

<div class="phone">
  <div class="screen">

    <video autoplay muted playsinline>
      <source src="lv_0_20260107052336.mp4" type="video/mp4">
    </video>

    <!-- HOOK -->
    <div class="overlay">
      <div id="hook">STOP. JANGAN JAWAB CEPAT.</div>
    </div>

    <!-- TENSION -->
    <div id="tension">Kelihatannya gampang. Tapi ini jebakan.</div>

    <!-- CTA -->
    <div id="cta">Ikutin selanjutnya.</div>

  </div>
</div>

</body>
</html>
