<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Professional Hook Animation</title>

<style>
html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  background:#000;
  overflow:hidden;
  display:flex;
  justify-content:center;
  align-items:center;
}

/* PHONE */
.phone{
  width:360px;
  height:720px;
  background:#111;
  border-radius:42px;
  box-shadow:0 30px 80px rgba(0,0,0,.7);
  position:relative;
}

/* SCREEN (BLUE INSIDE PHONE) */
.screen{
  position:absolute;
  inset:10px;
  border-radius:34px;
  background:linear-gradient(180deg,#1e3c72,#2a5298);
  overflow:hidden;
}

/* VIDEO */
video{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* HOOK TEXT */
#hook{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%) scale(1.35);
  font-family:'Anton',sans-serif;
  font-size:32px;
  color:#fff;
  letter-spacing:1px;
  z-index:10;
  pointer-events:none;
  animation:
    crackShake 0.9s ease-out forwards,
    settle 0.8s ease forwards 0.9s;
}

/* MICRO CRACK / RETAK (HALUS) */
@keyframes crackShake{
  0%   {transform:translate(-50%,-50%) scale(1.5);}
  20%  {transform:translate(-50%,-50%) scale(1.5) translateX(-2px);}
  40%  {transform:translate(-50%,-50%) scale(1.5) translateX(2px);}
  60%  {transform:translate(-50%,-50%) scale(1.5) translateX(-1px);}
  80%  {transform:translate(-50%,-50%) scale(1.5) translateX(1px);}
  100% {transform:translate(-50%,-50%) scale(1.5);}
}

/* ZOOM OUT + PIN KE ATAS */
@keyframes settle{
  to{
    top:7%;
    transform:translate(-50%,0) scale(0.78);
  }
}

/* CTA LEVEL 1 */
#cta{
  position:absolute;
  bottom:14%;
  left:50%;
  transform:translateX(-50%);
  font-family:'Anton',sans-serif;
  font-size:18px;
  color:#fff;
  opacity:0;
  animation:ctaIn 1.2s ease forwards;
  animation-delay:13.5s;
}
@keyframes ctaIn{
  from{opacity:0;transform:translate(-50%,20px)}
  to{opacity:1;transform:translate(-50%,0)}
}
</style>
</head>

<body>

<div class="phone">
  <div class="screen">

    <video autoplay muted playsinline>
      <source src="lv_0_20260107052336.mp4" type="video/mp4">
    </video>

    <!-- HOOK -->
    <div id="hook">STOP. JANGAN JAWAB CEPAT.</div>

    <!-- CTA -->
    <div id="cta">Ikutin selanjutnya.</div>

  </div>
</div>

</body>
</html>
