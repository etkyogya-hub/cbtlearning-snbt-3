<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>CBTLearning Hybrid – Advanced SNBT</title>

<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">

<style>
html,body{
  margin:0;height:100%;
  background:#020617;
  display:flex;justify-content:center;align-items:center;
  overflow:hidden;
}

/* PHONE 3D */
.phone{
  width:240px;height:480px;
  position:relative;border-radius:36px;
  background:linear-gradient(160deg,#0f172a,#020617);
  box-shadow:0 60px 140px rgba(0,0,0,.85);
  animation:float 7s ease-in-out infinite;
}
@keyframes float{
  0%,100%{transform:translateY(0) rotateX(3deg) rotateY(-3deg)}
  50%{transform:translateY(-6px) rotateX(5deg) rotateY(-5deg)}
}
.phone::before{
  content:"";position:absolute;inset:-3px;
  border-radius:38px;
  background:linear-gradient(180deg,transparent,rgba(56,189,248,.6),transparent);
  opacity:.55;pointer-events:none;
}

/* SCREEN */
.screen{
  position:absolute;inset:12px;
  border-radius:26px;overflow:hidden;
  background:#000;
}

/* VIDEO BG (HYBRID) */
.bgvideo{
  position:absolute;inset:0;
  width:100%;height:100%;
  object-fit:cover;opacity:.85;
}

/* SOAL */
.soal{
  position:absolute;top:86px;left:7%;width:86%;
  font-family:'Anton',sans-serif;
  font-size:22px;line-height:1.25;
  text-align:center;
  background:linear-gradient(
    90deg,#e0f2fe,#38bdf8,#818cf8,#38bdf8,#e0f2fe
  );
  background-size:300% 100%;
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  text-shadow:0 0 14px rgba(255,255,255,.35);
  opacity:0;
}
.flow{animation:electric 1.4s linear infinite;}
@keyframes electric{
  0%{background-position:0% 50%}
  100%{background-position:100% 50%}
}
.shake{animation:shake .6s ease-in-out;}
@keyframes shake{
  0%{transform:translateX(0)}
  25%{transform:translateX(-2px)}
  50%{transform:translateX(2px)}
  75%{transform:translateX(-1px)}
  100%{transform:translateX(0)}
}

/* OPSI */
.opsi{
  position:absolute;top:190px;left:10%;width:80%;
  font-size:13px;line-height:1.5;
  color:#e5e7eb;opacity:0;
}

/* RATIONALE */
.rationale{
  position:absolute;bottom:58px;left:8%;width:84%;
  font-size:12px;color:#fff;text-align:center;
  opacity:0;text-shadow:0 0 16px rgba(255,255,255,.6);
}

/* CTA LEVEL 2 */
.cta{
  position:absolute;bottom:100px;width:100%;
  text-align:center;font-size:14px;font-weight:700;
  color:#e0f2fe;opacity:0;
  text-shadow:0 0 20px rgba(56,189,248,.8);
}

/* CONTROL */
.show{opacity:1;transition:opacity .5s ease;}
.separator{
  position:absolute;inset:0;
  background:#020617;opacity:0;
  transition:opacity .25s ease;
}
.separator.show{opacity:1}
</style>
</head>

<body>

<div class="phone" id="phone">
  <div class="screen">

    <!-- GANTI video ini dengan demo kamu -->
    <video class="bgvideo" autoplay muted loop playsinline>
      <source src="CBT-Demo.mp4" type="video/mp4">
    </video>

    <div class="soal" id="soal"></div>
    <div class="opsi" id="opsi"></div>
    <div class="rationale" id="rat"></div>
    <div class="cta" id="cta">Tool-nya ada. Lihat di bio.</div>
    <div class="separator" id="sep"></div>

  </div>
</div>

<script>
/* ===== SOAL ADVANCED (TPS + Literasi + Logika + Numerasi) ===== */
const data=[
{
q:"Jika f(x)=2x²−3x+1, maka nilai minimum f(x) adalah …",
o:"A. −5/8<br>B. −1/8<br>C. 1/8<br>D. 5/8",
r:"Gunakan titik puncak parabola: x = −b/2a."
},
{
q:"Kalimat yang MENYIMPANG dari gagasan utama disebut …",
o:"A. Kalimat utama<br>B. Kalimat penjelas<br>C. Kalimat sumbang<br>D. Kalimat efektif",
r:"Kalimat sumbang tidak mendukung ide pokok."
},
{
q:"Jika rasio A:B:C = 2:3:5 dan jumlahnya 40, maka nilai B adalah …",
o:"A. 6<br>B. 8<br>C. 12<br>D. 15",
r:"Total rasio = 10, satu bagian = 4."
},
{
q:"Semua dosen adalah akademisi. Sebagian akademisi adalah peneliti. Kesimpulan yang tepat …",
o:"A. Semua dosen peneliti<br>B. Sebagian dosen peneliti<br>C. Semua peneliti dosen<br>D. Tidak dapat disimpulkan",
r:"Premis tidak cukup untuk hubungan sebagian dosen."
},
{
q:"Makna kata ‘konsekuen’ dalam teks argumentatif adalah …",
o:"A. Sebab<br>B. Akibat<br>C. Perbandingan<br>D. Penegasan",
r:"Konsekuen merujuk pada akibat logis."
},
{
q:"Rata-rata nilai 5 siswa adalah 78. Jika satu siswa bernilai 90, rata-rata 4 siswa lainnya adalah …",
o:"A. 72<br>B. 74<br>C. 75<br>D. 76",
r:"Hitung total nilai lalu kurangi."
},
{
q:"Pernyataan yang setara dengan ‘Jika hujan maka jalan basah’ adalah …",
o:"A. Jika jalan basah maka hujan<br>B. Jika tidak hujan maka jalan tidak basah<br>C. Jika jalan tidak basah maka tidak hujan<br>D. Hujan dan jalan basah",
r:"Gunakan kontraposisi."
},
{
q:"Kata hubung yang menunjukkan pertentangan adalah …",
o:"A. Karena<br>B. Sehingga<br>C. Namun<br>D. Agar",
r:"‘Namun’ menyatakan oposisi."
},
{
q:"Jika peluang A = 0,35 dan A dan B saling lepas, peluang A atau B = 0,6, maka peluang B adalah …",
o:"A. 0,15<br>B. 0,25<br>C. 0,35<br>D. 0,45",
r:"P(A∪B)=P(A)+P(B)."
}
];

const soal=document.getElementById("soal");
const opsi=document.getElementById("opsi");
const rat=document.getElementById("rat");
const sep=document.getElementById("sep");
const cta=document.getElementById("cta");
const phone=document.getElementById("phone");

const hues=[195,210,225,240];
let i=0;

function next(){
  sep.classList.remove("show");
  soal.className="soal";
  opsi.className="opsi";
  rat.className="rationale";

  const d=data[i];
  soal.innerHTML=d.q;
  opsi.innerHTML=d.o;
  rat.innerHTML=d.r;

  const hue=hues[Math.floor(Math.random()*hues.length)];
  phone.style.background=
    `linear-gradient(160deg,hsl(${hue},45%,18%),#020617)`;

  setTimeout(()=>soal.classList.add("show","flow","shake"),250);
  setTimeout(()=>opsi.classList.add("show"),850);
  setTimeout(()=>rat.classList.add("show"),1400);
  setTimeout(()=>sep.classList.add("show"),3200);

  if(i===data.length-1){
    setTimeout(()=>cta.classList.add("show"),4200);
  }

  i=(i+1)%data.length;
  setTimeout(next,3900);
}

next();
</script>

</body>
</html>
