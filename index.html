<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<title>Professional Phone Mockup – TikTok</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  height:100%;
  background:#000;
  overflow:hidden;
  font-family:'Anton',system-ui,sans-serif;
}

/* ===== STAGE ===== */
.stage{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* ===== RESPONSIVE PHONE SCALE ===== */
.phone-wrap{
  width:min(420px, 92vw);
  aspect-ratio:9/19.5;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* ===== PHONE BODY (PRO 3D) ===== */
.phone{
  width:100%;
  height:100%;
  position:relative;
  border-radius:48px;
  background:linear-gradient(145deg,#1e3c72,#2a5298);
  box-shadow:
    0 50px 120px rgba(0,0,0,.8),
    inset 0 0 0 2px rgba(255,255,255,.08);
  padding:14px;
  transform:perspective(1400px) rotateX(7deg) rotateY(-7deg);
}

/* EDGE LIGHT */
.phone::before{
  content:"";
  position:absolute;
  inset:0;
  border-radius:48px;
  background:linear-gradient(120deg,rgba(255,255,255,.28),transparent 45%);
  pointer-events:none;
}

/* ===== SCREEN ===== */
.screen{
  width:100%;
  height:100%;
  border-radius:36px;
  overflow:hidden;
  background:#000;
  position:relative;
}

/* ===== VIDEO ===== */
video{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* ===== OVERLAY ===== */
.overlay{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding-top:13%;
  pointer-events:none;
  text-align:center;
}

/* ===== HOOK (BIG → FIT → STAY) ===== */
#hook{
  font-size:clamp(30px,4.5vw,40px);
  color:#fff;
  letter-spacing:1px;
  animation:hookStay 6s ease-out forwards;
}

@keyframes hookStay{
  0%{
    transform:scale(1.6);
    opacity:1;
  }
  18%{
    transform:scale(1.28) translateX(-10px);
  }
  32%{
    transform:scale(1.15) translateX(10px);
  }
  55%{
    transform:scale(1);
  }
  100%{
    transform:scale(1);
    opacity:1;
  }
}

/* SUB TENSION (MENYATU) */
#subhook{
  margin-top:10px;
  font-size:14px;
  color:#dfe9ff;
  opacity:0;
  animation:subIn 1s ease forwards;
  animation-delay:1.8s;
}

@keyframes subIn{
  to{opacity:1}
}

/* ===== CTA LEVEL 1 ===== */
#cta{
  position:absolute;
  bottom:12%;
  width:100%;
  text-align:center;
  font-size:18px;
  color:#fff;
  opacity:0;
  animation:ctaIn 1.2s ease forwards;
  animation-delay:11.5s;
}

@keyframes ctaIn{
  from{opacity:0; transform:translateY(18px)}
  to{opacity:1; transform:translateY(0)}
}
</style>
</head>

<body>

<div class="stage">
  <div class="phone-wrap">
    <div class="phone">
      <div class="screen">

        <video autoplay muted playsinline>
          <source src="lv_0_20260107052336.mp4" type="video/mp4">
        </video>

        <!-- HOOK -->
        <div class="overlay">
          <div id="hook">90% ORANG SALAH DI SINI.</div>
          <div id="subhook">Bukan karena bodoh. Tapi karena refleks.</div>
        </div>

        <!-- CTA -->
        <div id="cta">Ikutin selanjutnya.</div>

      </div>
    </div>
  </div>
</div>

</body>
</html>
