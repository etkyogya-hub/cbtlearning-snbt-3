<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SNBT Figural</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#000;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  font-family:Arial,Helvetica,sans-serif;
}
.container{
  width:720px;
  background:#fff;
  padding:20px;
}
.row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:20px;
}
.frame{
  width:140px;
  height:140px;
  border:2px solid #000;
  position:relative;
}
.sym{
  font-size:32px;
  font-weight:900;
}

/* ===== SHAPES ===== */
.hex{
  position:absolute;
  left:20px; top:28px;
  width:80px; height:80px;
  background:#fff;
  border:2px solid #000;
  clip-path:polygon(
    25% 0%, 75% 0%,
    100% 50%,
    75% 100%, 25% 100%,
    0% 50%
  );
}
.hex.fill{
  background:repeating-linear-gradient(
    45deg,#000 0 2px,transparent 2px 4px
  );
}

.dot{
  position:absolute;
  width:14px;height:14px;
  border-radius:50%;
  border:2px solid #000;
}
.dot.fill{background:#000}

.chev{
  position:absolute;
  left:30px; top:30px;
  width:0;height:0;
  border-top:40px solid transparent;
  border-bottom:40px solid transparent;
  border-left:60px solid #000;
}
.chev.outline{
  border-left-color:transparent;
  border-left:2px solid #000;
}

/* OPTIONS */
.options{
  display:flex;
  justify-content:space-between;
}
.opt{
  width:120px;
  height:120px;
  border:2px solid #000;
  position:relative;
}
.label{
  position:absolute;
  bottom:-22px;
  left:50%;
  transform:translateX(-50%);
  font-weight:900;
}
</style>
</head>

<body>
<div class="container">

<!-- A : B = C : ? -->
<div class="row">
  <!-- A -->
  <div class="frame">
    <div class="hex"></div>
    <div class="dot" style="right:14px;top:26px"></div>
    <div class="dot fill" style="right:14px;top:56px"></div>
    <div class="dot" style="right:14px;top:86px"></div>
  </div>

  <div class="sym">:</div>

  <!-- B -->
  <div class="frame">
    <div class="hex fill"></div>
    <div class="dot" style="right:14px;top:26px"></div>
    <div class="dot" style="right:14px;top:56px"></div>
    <div class="dot" style="right:14px;top:86px"></div>
  </div>

  <div class="sym">=</div>

  <!-- C -->
  <div class="frame">
    <div class="chev outline"></div>
    <div class="dot" style="right:14px;top:26px"></div>
    <div class="dot fill" style="right:14px;top:56px"></div>
    <div class="dot" style="right:14px;top:86px"></div>
  </div>

  <div class="sym">:</div>

  <!-- ? -->
  <div class="frame" style="display:flex;justify-content:center;align-items:center;font-size:40px;font-weight:900">
    ?
  </div>
</div>

<!-- OPTIONS -->
<div class="options">

<div class="opt">
  <div class="chev"></div>
  <div class="dot fill" style="right:14px;top:26px"></div>
  <div class="dot" style="right:14px;top:56px"></div>
  <div class="dot" style="right:14px;top:86px"></div>
  <div class="label">A</div>
</div>

<div class="opt">
  <div class="chev outline"></div>
  <div class="dot" style="right:14px;top:26px"></div>
  <div class="dot" style="right:14px;top:56px"></div>
  <div class="dot fill" style="right:14px;top:86px"></div>
  <div class="label">B</div>
</div>

<div class="opt">
  <div class="chev"></div>
  <div class="dot" style="right:14px;top:26px"></div>
  <div class="dot" style="right:14px;top:56px"></div>
  <div class="dot" style="right:14px;top:86px"></div>
  <div class="label">C</div>
</div>

<div class="opt">
  <div class="chev fill"></div>
  <div class="dot" style="right:14px;top:26px"></div>
  <div class="dot" style="right:14px;top:56px"></div>
  <div class="dot" style="right:14px;top:86px"></div>
  <div class="label">D</div>
</div>

<div class="opt">
  <div class="chev outline"></div>
  <div class="dot" style="right:14px;top:26px"></div>
  <div class="dot fill" style="right:14px;top:56px"></div>
  <div class="dot" style="right:14px;top:86px"></div>
  <div class="label">E</div>
</div>

</div>

</div>
</body>
</html>
