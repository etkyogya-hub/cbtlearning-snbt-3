<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>SNBT Logic Walkthrough</title>

<!-- FONT -->
<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  height:100vh;
  background:#020617;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:system-ui;
}

/* ===== PHONE ===== */
.phone{
  width:260px;
  height:520px;
  border-radius:38px;
  background:#020617;
  box-shadow:0 40px 90px rgba(0,0,0,.85);
  position:relative;
}
.screen{
  position:absolute;
  inset:12px;
  border-radius:28px;
  background:#020617;
  padding:14px;
  color:#e5e7eb;
  overflow:hidden;
}

/* ===== TITLE ===== */
.title{
  font-family:'Anton', sans-serif;
  font-size:20px;
  text-align:center;
  margin-bottom:10px;
  animation:titleIn .6s ease forwards;
}
@keyframes titleIn{
  0%{opacity:0;transform:scale(1.3)}
  60%{opacity:1;transform:scale(.92)}
  100%{transform:scale(1)}
}
.pulse{
  animation:pulse .35s ease-in-out 2;
}
@keyframes pulse{
  0%{color:#fff}
  50%{color:#38bdf8}
  100%{color:#fff}
}

/* ===== QUESTION ===== */
.question span{
  display:inline-block;
  opacity:0;
  transform:scale(.6);
  animation:wordIn .18s ease forwards;
}
@keyframes wordIn{
  to{opacity:1;transform:scale(1)}
}

/* ===== OPTIONS ===== */
.options{
  margin-top:10px;
}
.options li{
  list-style:none;
  margin:6px 0;
  padding:6px 8px;
  border:1px solid #334155;
  border-radius:8px;
  opacity:0;
  transform:translateY(6px);
  animation:optIn .22s ease forwards;
}
@keyframes optIn{
  to{opacity:1;transform:translateY(0)}
}

/* ===== CORRECT ===== */
.correct{
  border-color:#22c55e !important;
  background:rgba(34,197,94,.18);
}

/* ===== RATIONALE ===== */
.rationale{
  margin-top:10px;
  padding:8px;
  border-left:3px solid #38bdf8;
  font-size:12px;
  line-height:1.45;
  opacity:0;
  animation:fadeIn .4s ease forwards;
}
@keyframes fadeIn{
  to{opacity:1}
}
</style>
</head>

<body>

<div class="phone">
  <div class="screen">

    <div class="title" id="title">
      LOGIKA CEPAT ALJABAR — SNBT
    </div>

    <div class="question" id="question">
      Jika 3x + 5 = 20, maka nilai x adalah
    </div>

    <ul class="options" id="options">
      <li>A. 3</li>
      <li>B. 4</li>
      <li>C. 5</li>
      <li>D. 6</li>
    </ul>

    <div class="rationale" id="rationale">
      Pindahkan konstanta dulu: 20 − 5 = 15.  
      Baru bagi koefisien: x = 15 ÷ 3.  
      Fokus geser ruas, bukan hitung panjang.
    </div>

  </div>
</div>

<script>
/* TITLE EFFECT */
const title=document.getElementById("title");
setTimeout(()=>title.classList.add("pulse"),500);

/* SPLIT QUESTION */
const q=document.getElementById("question");
const words=q.innerText.split(" ");
q.innerHTML="";
words.forEach((w,i)=>{
  const s=document.createElement("span");
  s.innerText=w+" ";
  s.style.animationDelay=(1+i*0.06)+"s";
  q.appendChild(s);
});

/* OPTIONS */
document.querySelectorAll(".options li").forEach((li,i)=>{
  li.style.animationDelay=(2.2+i*0.25)+"s";
});

/* CORRECT */
setTimeout(()=>{
  document.querySelectorAll(".options li")[2].classList.add("correct");
},3600);

/* RATIONALE */
setTimeout(()=>{
  document.getElementById("rationale").style.animationDelay="0s";
},5200);
</script>

</body>
</html>
