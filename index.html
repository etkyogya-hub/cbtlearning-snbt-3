<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>IST Figural Test</title>
<style>
body{
  margin:0;
  background:#222;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  font-family:Arial, Helvetica, sans-serif;
}

/* PHONE FRAME */
.phone{
  width:360px;
  height:640px;
  background:#f5f5f5;
  border-radius:26px;
  overflow:hidden;
  position:relative;
  color:#111;
}

/* HEADER */
.header{
  position:absolute;
  top:14px;
  width:100%;
  text-align:center;
  font-size:16px;
  font-weight:700;
}

/* SUBTITLE */
.sub{
  position:absolute;
  top:38px;
  width:100%;
  text-align:center;
  font-size:12px;
  color:#555;
}

/* TIMER */
#timer{
  position:absolute;
  top:64px;
  width:100%;
  text-align:center;
  font-size:40px;
  font-weight:700;
}

/* FIGURAL GRID */
.grid{
  position:absolute;
  top:140px;
  width:100%;
  display:grid;
  grid-template-columns:repeat(3,68px);
  grid-template-rows:repeat(3,68px);
  gap:10px;
  justify-content:center;
}
.cell{
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
  border:2px solid #999;
  background:#fff;
}

/* CTA */
#cta{
  position:absolute;
  bottom:26px;
  left:50%;
  transform:translateX(-50%);
  border:2px solid #111;
  padding:10px 20px;
  font-size:13px;
  font-weight:600;
  opacity:0;
  transition:opacity 0.4s;
}
</style>
</head>

<body>

<div class="phone">

  <!-- HEADER -->
  <div class="header">FIGURAL REASONING</div>
  <div class="sub">IST / TPA / SKD Type</div>

  <!-- TIMER -->
  <div id="timer">20</div>

  <!-- FIGURAL -->
  <div class="grid">
    <div class="cell">└</div>
    <div class="cell">┴</div>
    <div class="cell">┬</div>

    <div class="cell">├</div>
    <div class="cell">┼</div>
    <div class="cell">┤</div>

    <div class="cell">┌</div>
    <div class="cell">┬</div>
    <div class="cell">?</div>
  </div>

  <!-- CTA -->
  <div id="cta">Tulis jawaban Anda</div>

</div>

<script>
let time = 20;
const timer = document.getElementById("timer");
const cta = document.getElementById("cta");

const interval = setInterval(()=>{
  time--;
  timer.textContent = time;
  if(time <= 0){
    clearInterval(interval);
    cta.style.opacity = 1;
  }
},1000);
</script>

</body>
</html>
