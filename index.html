<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>SNBT HOOK</title>

<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  height:100vh;
  background:#020617;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
}

.hook-wrap{
  text-align:center;
  transform:scale(1.6);
  animation:zoomOut 1.8s ease forwards;
}

@keyframes zoomOut{
  0%{transform:scale(1.6)}
  70%{transform:scale(1)}
  100%{transform:scale(1)}
}

.title{
  font-family:'Anton',sans-serif;
  font-size:44px;
  color:#fff;
  letter-spacing:1px;
  animation:hit .25s ease infinite alternate;
}

@keyframes hit{
  from{transform:translate(-2px,2px)}
  to{transform:translate(2px,-2px)}
}

/* CHAOS SYMBOLS */
.symbol{
  position:absolute;
  font-size:22px;
  color:#38bdf8;
  animation:shake .4s ease infinite alternate;
}

@keyframes shake{
  from{transform:translate(-3px,-3px)}
  to{transform:translate(3px,3px)}
}
</style>
</head>

<body>

<div class="hook-wrap">
  <div class="title">LOGIKA SNBT</div>
</div>

<script>
const symbols=["▲","■","●","×","+","=","?","∴"];
for(let i=0;i<14;i++){
  const s=document.createElement("div");
  s.className="symbol";
  s.innerText=symbols[Math.floor(Math.random()*symbols.length)];
  s.style.left=50+Math.random()*120+"px";
  s.style.top =40+Math.random()*120+"px";
  s.style.animationDelay=(Math.random()*0.2)+"s";
  document.body.appendChild(s);
}

/* FREEZE FRAME (ALGO FRIENDLY) */
setTimeout(()=>{
  document.querySelectorAll(".symbol").forEach(el=>{
    el.style.animation="none";
  });
  document.querySelector(".title").style.animation="none";
},1400);
</script>

</body>
</html>
