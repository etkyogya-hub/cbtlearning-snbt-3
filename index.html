<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SNBT Figural Komposisi Hardcore</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#000;display:flex;justify-content:center;align-items:center;height:100vh;font-family:Arial,sans-serif;color:#fff}
.phone{width:360px;height:640px;background:#0b0b0b;border-radius:36px;border:4px solid #3aa0ff;overflow:hidden;position:relative}
.screen{position:absolute;inset:0;padding:18px;display:none;flex-direction:column;align-items:center}
.screen.active{display:flex}
.hook{font-size:22px;font-weight:900;text-align:center;animation:shake .12s infinite alternate,color .25s infinite alternate}
@keyframes shake{from{transform:translateX(-2px)}to{transform:translateX(2px)}}
@keyframes color{0%{color:#ff5555}25%{color:#55ff55}50%{color:#5555ff}75%{color:#ffff55}100%{color:#ff55ff}}
.level{margin-top:6px;font-size:13px;opacity:.7}
.row{margin-top:18px;display:flex;gap:12px}
.box{width:96px;height:96px;background:#1c1c1c;border:2px solid #fff;border-radius:6px;display:flex;justify-content:center;align-items:center}
.box.q{border-style:dashed;font-size:32px;font-weight:800}
.options{margin-top:18px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{display:flex;flex-direction:column;align-items:center}
.lbl{font-size:12px;opacity:.6}
svg{width:78px;height:78px}
.rationale{margin-top:14px;font-size:13px;line-height:1.35;opacity:.85;text-align:center}
.cta{margin-top:20px;font-size:16px;font-weight:800;padding:10px 14px;border:2px solid #fff;border-radius:8px;animation:pulse .8s infinite alternate}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.06)}}
</style>
</head>

<body>
<div class="phone">

<script>
const Q=[
{
a:`<svg viewBox="0 0 100 100">
<polygon points="10,10 60,10 10,60" fill="#fff"/>
<rect x="62" y="12" width="10" height="20" fill="url(#s)"/>
<rect x="62" y="36" width="10" height="20" fill="url(#s)"/>
<rect x="62" y="60" width="10" height="20" fill="url(#s)"/>
<defs><pattern id="s" width="4" height="4" patternUnits="userSpaceOnUse">
<line x1="0" y1="4" x2="4" y2="0" stroke="#fff" stroke-width="1"/></pattern></defs>
</svg>`,
b:`<svg viewBox="0 0 100 100">
<polygon points="90,10 40,10 90,60" fill="#fff"/>
<rect x="28" y="12" width="10" height="20" fill="url(#s)"/>
<rect x="28" y="36" width="10" height="20" fill="url(#s)"/>
<rect x="28" y="60" width="10" height="20" fill="url(#s)"/>
</svg>`,
o:`<svg viewBox="0 0 100 100">
<polygon points="10,90 60,90 10,40" fill="#fff"/>
<rect x="62" y="20" width="10" height="20" fill="url(#s)"/>
<rect x="62" y="44" width="10" height="20" fill="url(#s)"/>
<rect x="62" y="68" width="10" height="20" fill="url(#s)"/>
</svg>`,
r:`Segitiga besar bermirror horizontal. Tiga persegi panjang arsir mempertahankan jumlah dan orientasi relatif.`
},
{
a:`<svg viewBox="0 0 100 100">
<circle cx="30" cy="30" r="10" fill="#fff"/>
<circle cx="70" cy="30" r="10" fill="#fff"/>
<rect x="25" y="50" width="50" height="20" fill="#fff"/>
</svg>`,
b:`<svg viewBox="0 0 100 100">
<circle cx="30" cy="70" r="10" fill="#fff"/>
<circle cx="70" cy="70" r="10" fill="#fff"/>
<rect x="25" y="30" width="50" height="20" fill="#fff"/>
</svg>`,
o:`<svg viewBox="0 0 100 100">
<circle cx="30" cy="30" r="10" fill="#fff"/>
<circle cx="70" cy="70" r="10" fill="#fff"/>
<rect x="25" y="40" width="50" height="20" fill="#fff"/>
</svg>`,
r:`Pasangan lingkaran berpindah simetris vertikal, balok tetap di tengah sebagai penyeimbang.`
},
{
a:`<svg viewBox="0 0 100 100">
<rect x="10" y="10" width="30" height="30" fill="#fff"/>
<rect x="60" y="10" width="30" height="30" fill="#fff"/>
<rect x="35" y="60" width="30" height="30" fill="#fff"/>
</svg>`,
b:`<svg viewBox="0 0 100 100">
<rect x="35" y="10" width="30" height="30" fill="#fff"/>
<rect x="10" y="60" width="30" height="30" fill="#fff"/>
<rect x="60" y="60" width="30" height="30" fill="#fff"/>
</svg>`,
o:`<svg viewBox="0 0 100 100">
<rect x="10" y="10" width="30" height="30" fill="#fff"/>
<rect x="35" y="35" width="30" height="30" fill="#fff"/>
<rect x="60" y="60" width="30" height="30" fill="#fff"/>
</svg>`,
r:`Tiga unit berpindah mengikuti rotasi pola segitiga, bukan translasi linear.`
},
{
a:`<svg viewBox="0 0 100 100">
<polygon points="20,80 50,20 80,80" fill="#fff"/>
<rect x="42" y="50" width="16" height="30" fill="#000"/>
</svg>`,
b:`<svg viewBox="0 0 100 100">
<polygon points="20,20 80,20 50,80" fill="#fff"/>
<rect x="42" y="20" width="16" height="30" fill="#000"/>
</svg>`,
o:`<svg viewBox="0 0 100 100">
<polygon points="80,20 80,80 20,50" fill="#fff"/>
<rect x="20" y="42" width="30" height="16" fill="#000"/>
</svg>`,
r:`Segitiga berotasi 120°. Balok hitam selalu menempel pada sisi alas segitiga.`
},
{
a:`<svg viewBox="0 0 100 100">
<rect x="20" y="20" width="60" height="60" fill="#fff"/>
<circle cx="50" cy="50" r="12" fill="#000"/>
</svg>`,
b:`<svg viewBox="0 0 100 100">
<rect x="20" y="20" width="60" height="60" fill="#fff"/>
<circle cx="35" cy="35" r="12" fill="#000"/>
</svg>`,
o:`<svg viewBox="0 0 100 100">
<rect x="20" y="20" width="60" height="60" fill="#fff"/>
<circle cx="65" cy="65" r="12" fill="#000"/>
</svg>`,
r:`Elemen pusat berpindah mengikuti diagonal utama, jarak konsisten.`
},
{
a:`<svg viewBox="0 0 100 100">
<rect x="10" y="10" width="80" height="20" fill="#fff"/>
<rect x="10" y="40" width="80" height="20" fill="url(#s)"/>
</svg>`,
b:`<svg viewBox="0 0 100 100">
<rect x="10" y="40" width="80" height="20" fill="#fff"/>
<rect x="10" y="10" width="80" height="20" fill="url(#s)"/>
</svg>`,
o:`<svg viewBox="0 0 100 100">
<rect x="10" y="25" width="80" height="20" fill="#fff"/>
<rect x="10" y="55" width="80" height="20" fill="url(#s)"/>
</svg>`,
r:`Pertukaran atribut: solid ↔ arsir, posisi ikut bergeser teratur.`
},
{
a:`<svg viewBox="0 0 100 100">
<circle cx="30" cy="50" r="12" fill="#fff"/>
<circle cx="70" cy="50" r="12" fill="#fff"/>
</svg>`,
b:`<svg viewBox="0 0 100 100">
<circle cx="30" cy="30" r="12" fill="#fff"/>
<circle cx="70" cy="70" r="12" fill="#fff"/>
</svg>`,
o:`<svg viewBox="0 0 100 100">
<circle cx="50" cy="30" r="12" fill="#fff"/>
<circle cx="50" cy="70" r="12" fill="#fff"/>
</svg>`,
r:`Pasangan simetris berubah orientasi: horizontal → diagonal → vertikal.`
},
{
a:`<svg viewBox="0 0 100 100">
<rect x="20" y="20" width="20" height="60" fill="#fff"/>
<rect x="60" y="20" width="20" height="60" fill="#000"/>
</svg>`,
b:`<svg viewBox="0 0 100 100">
<rect x="20" y="20" width="20" height="60" fill="#000"/>
<rect x="60" y="20" width="20" height="60" fill="#fff"/>
</svg>`,
o:`<svg viewBox="0 0 100 100">
<rect x="20" y="20" width="20" height="60" fill="#fff"/>
<rect x="40" y="20" width="20" height="60" fill="#000"/>
<rect x="60" y="20" width="20" height="60" fill="#fff"/>
</svg>`,
r:`Inversi warna diikuti penambahan elemen sebagai penyeimbang visual.`
},
{
a:`<svg viewBox="0 0 100 100">
<polygon points="20,20 80,20 50,50" fill="#fff"/>
<polygon points="20,80 80,80 50,50" fill="#fff"/>
</svg>`,
b:`<svg viewBox="0 0 100 100">
<polygon points="20,20 50,50 20,80" fill="#fff"/>
<polygon points="80,20 50,50 80,80" fill="#fff"/>
</svg>`,
o:`<svg viewBox="0 0 100 100">
<polygon points="20,20 80,80 50,50" fill="#fff"/>
<polygon points="80,20 20,80 50,50" fill="#fff"/>
</svg>`,
r:`Dua segitiga selalu berpasangan dan berpotongan di pusat. Orientasi berubah sistematis.`
}
];

let html='';
Q.forEach((q,i)=>{
html+=`
<div class="screen ${i===0?'active':''}">
  <div class="hook">LOGIKA FIGURAL</div>
  <div class="level">Soal ${i+1} / 9</div>

  <div class="row">
    <div class="box">${q.a}</div>
    <div class="box">${q.b}</div>
    <div class="box q">?</div>
  </div>

  <div class="options">
    <div class="opt"><div class="box">${q.o}</div><div class="lbl">A</div></div>
    <div class="opt"><div class="box">${q.a}</div><div class="lbl">B</div></div>
    <div class="opt"><div class="box">${q.b}</div><div class="lbl">C</div></div>
    <div class="opt"><div class="box">${q.a}</div><div class="lbl">D</div></div>
  </div>

  <div class="rationale">${q.r}</div>
  ${i===8?'<div class="cta">FOLLOW • SAVE • PART 2 ➜</div>':''}
</div>`;
});
document.write(html);

let idx=0;
setInterval(()=>{
  const s=document.querySelectorAll('.screen');
  s.forEach(e=>e.classList.remove('active'));
  idx=(idx+1)%s.length;
  s[idx].classList.add('active');
},4200);
</script>

</div>
</body>
</html>
