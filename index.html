<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Figural Frame Illusion</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{
  width:100%;height:100%;
  background:#000;
  font-family:Arial Black, Impact, sans-serif;
  color:#fff;
  overflow:hidden;
}

/* PHONE */
.wrap{
  width:100%;height:100%;
  display:flex;
  justify-content:center;
  align-items:center;
}
.phone{
  width:360px;height:640px;
  border-radius:36px;
  border:8px solid #111;
  position:relative;
  overflow:hidden;
  background:#000;
}

/* SAFE AREA */
.safe{
  position:absolute;
  top:70px;bottom:90px;
  left:20px;right:70px;
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
}

/* TEXT */
.level{font-size:13px;letter-spacing:3px;opacity:.6}
.hook{font-size:26px;margin-top:6px}
.small{font-size:13px;opacity:.8;margin-top:6px}
.danger{
  color:#ff2f2f;
  text-shadow:0 0 14px rgba(255,0,0,.55);
}

/* FIGURAL */
.figural{
  margin-top:18px;
  display:grid;
  grid-template-columns:repeat(3,70px);
  grid-template-rows:repeat(3,70px);
  gap:8px;
}
.cell{
  border:2px solid #fff;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:26px;
  font-weight:bold;
  transition:all .6s ease;
}

/* UI */
.ui{
  position:absolute;
  right:10px;
  top:130px;
  font-size:14px;
}

/* COMMENT */
.comment{
  position:absolute;
  right:70px;
  top:260px;
  max-width:210px;
  padding:10px 12px;
  background:rgba(20,20,20,.96);
  border-radius:14px;
  font-size:13px;
  opacity:0;
}
@keyframes commentIn{
  from{transform:translateX(14px);opacity:0}
  to{transform:translateX(0);opacity:1}
}
@keyframes commentOut{
  from{opacity:1}
  to{opacity:0}
}
.comment-show{animation:commentIn .4s ease forwards}
.comment-hide{animation:commentOut .4s ease forwards}

.hidden{display:none}
</style>
</head>

<body>

<div class="wrap">
<div class="phone">

<!-- UI -->
<div class="ui">
  ❤️ 1.8K<br>
  💬 104<br>
  ↗ Share
</div>

<!-- COMMENT -->
<div id="comment" class="comment">
  “Tunggu… barusan beda gak sih?”
</div>

<div class="safe">

<div class="level">LEVEL 13</div>
<div class="hook danger">JANGAN BERKEDIP</div>
<div class="small danger">Perubahannya HALUS</div>

<!-- FIGURAL GRID -->
<div id="grid" class="figural">
  <div class="cell">▲</div><div class="cell">▲</div><div class="cell">▲</div>
  <div class="cell">●</div><div class="cell">●</div><div class="cell">●</div>
  <div class="cell">■</div><div class="cell">■</div><div class="cell">?</div>
</div>

<div class="small" style="margin-top:10px">
  Pola berubah setiap beberapa detik.
</div>

<div id="cta" class="small hidden">
  Kalau ini terasa statis, berarti kamu belum lihat.
</div>

</div>
</d
