<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>CBT Chaos Opening</title>
<style>
  html, body {
    margin: 0;
    background: black;
    overflow: hidden;
    width: 100%;
    height: 100%;
    font-family: Arial, sans-serif;
  }
  .item {
    position: absolute;
    color: white;
    font-size: 32px;
    font-weight: bold;
    animation: chaos 1.5s linear forwards;
    opacity: 0;
  }
  @keyframes chaos {
    0% { transform: scale(0.3) rotate(0deg); opacity: 0; }
    20% { opacity: 1; }
    80% { opacity: 1; }
    100% { transform: scale(1.5) rotate(360deg); opacity: 0; }
  }
</style>
</head>
<body>

<script>
const elements = [
  "2x+3", "√16", "p→q", "¬p", "∧", "∨",
  "Jika p maka q", "Kesimpulan?", "A B C D",
  "SALAH", "TERJEBAK", "01", "02", "03"
];

for (let i = 0; i < 18; i++) {
  const el = document.createElement("div");
  el.className = "item";
  el.innerText = elements[Math.floor(Math.random() * elements.length)];
  el.style.left = Math.random() * 90 + "vw";
  el.style.top = Math.random() * 90 + "vh";
  el.style.fontSize = (24 + Math.random() * 40) + "px";
  el.style.animationDelay = (Math.random() * 0.4) + "s";
  document.body.appendChild(el);
}
</script>

</body>
</html>
