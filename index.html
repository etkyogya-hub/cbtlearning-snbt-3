<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Hook Retention CTA</title>

<style>
html,body{
  margin:0;
  padding:0;
  background:#000;
  overflow:hidden;
}
video{
  width:100vw;
  height:100vh;
  object-fit:cover;
}

/* COMMON */
.overlay{
  position:absolute;
  top:0;left:0;
  width:100%;
  height:100%;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  pointer-events:none;
  font-family: 'Anton', sans-serif;
}

/* HOOK */
#hook{
  font-size:7vw;
  color:white;
  opacity:0;
  animation:hookShake 2s ease-out forwards;
}
@keyframes hookShake{
  0%{opacity:0;transform:scale(1.4) translateX(-10px);}
  10%{opacity:1;transform:scale(1.2) translateX(10px);}
  20%{transform:scale(1.15) translateX(-8px);}
  30%{transform:scale(1.1) translateX(6px);}
  40%{transform:scale(1.05) translateX(-4px);}
  60%{transform:scale(1) translateX(0);}
  100%{opacity:0;}
}

/* TENSION TEXT */
#tension{
  position:absolute;
  bottom:18%;
  font-size:3.5vw;
  color:#ddd;
  opacity:0;
  animation:tensionFade 4s ease forwards;
  animation-delay:5s;
}
@keyframes tensionFade{
  0%{opacity:0;}
  20%{opacity:1;}
  80%{opacity:1;}
  100%{opacity:0;}
}

/* CTA */
#cta{
  position:absolute;
  bottom:12%;
  font-size:4vw;
  color:white;
  opacity:0;
  animation:ctaIn 1.2s ease forwards;
  animation-delay:13.5s;
}
@keyframes ctaIn{
  0%{opacity:0;transform:translateY(20px);}
  100%{opacity:1;transform:translateY(0);}
}
</style>
</head>

<body>

<video autoplay muted playsinline>
  <source src="lv_0_20260107052336.mp4" type="video/mp4">
</video>

<!-- HOOK -->
<div class="overlay">
  <div id="hook">STOP. JANGAN JAWAB CEPAT.</div>
</div>

<!-- TENSION -->
<div id="tension">Kelihatannya gampang. Tapi ini jebakan.</div>

<!-- CTA -->
<div id="cta">Ikutin selanjutnya.</div>

</body>
</html>
