<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CBT Figural Reasoning</title>
<style>
body{
  margin:0;
  background:#111;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  font-family:Arial, Helvetica, sans-serif;
}

/* PHONE */
.phone{
  width:360px;
  height:640px;
  background:#1b1b1b;
  border-radius:26px;
  overflow:hidden;
  position:relative;
  color:#fff;
}

/* HEADER */
.header{
  text-align:center;
  font-size:15px;
  font-weight:700;
  margin-top:14px;
}
.sub{
  text-align:center;
  font-size:11px;
  color:#aaa;
  margin-bottom:10px;
}

/* TIMER */
#timer{
  text-align:center;
  font-size:36px;
  font-weight:700;
  margin-bottom:10px;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(3,80px);
  grid-template-rows:repeat(3,80px);
  gap:12px;
  justify-content:center;
  margin-top:20px;
}

/* CELL */
.cell{
  background:#222;
  border-radius:10px;
  display:flex;
  justify-content:center;
  align-items:center;
}

/* FIGURES */
.box{
  width:28px;
  height:28px;
  border:3px solid #4fd1c5;
}
.circle{
  width:26px;
  height:26px;
  border-radius:50%;
  border:3px solid #f56565;
}
.triangle{
  width:0;
  height:0;
  border-left:14px solid transparent;
  border-right:14px solid transparent;
  border-bottom:26px solid #ecc94b;
}

/* CTA */
#cta{
  position:absolute;
  bottom:22px;
  left:50%;
  transform:translateX(-50%);
  border:2px solid #fff;
  padding:10px 22px;
  font-size:13px;
  font-weight:600;
  opacity:0;
  transition:opacity 0.4s;
}
</style>
</head>

<body>

<div class="phone">

  <div class="header">FIGURAL REASONING</div>
  <div class="sub">IST / TPA / SKD — CBT MODE</div>

  <div id="timer">25</div>

  <div class="grid">
    <div class="cell"><div class="box"></div></div>
    <div class="cell"><div class="circle"></div></div>
    <div class="cell"><div class="triangle"></div></div>

    <div class="cell">
      <div class="box"></div>
      <div class="circle" style="margin-left:6px"></div>
    </div>
    <div class="cell">
      <div class="circle"></div>
      <div class="triangle" style="margin-left:6px"></div>
    </div>
    <div class="cell">
      <div class="triangle"></div>
      <div class="box" style="margin-left:6px"></div>
    </div>

    <div class="cell">
      <div class="box"></div>
      <div class="circle" style="margin-left:6px"></div>
      <div class="triangle" style="margin-left:6px"></div>
    </div>
    <div class="cell">
      <div class="circle"></div>
      <div class="triangle" style="margin-left:6px"></div>
      <div class="box" style="margin-left:6px"></div>
    </div>
    <div class="cell">?</div>
  </div>

  <div id="cta">Tentukan figurnya</div>

</div>

<script>
let t = 25;
const timer = document.getElementById("timer");
const cta = document.getElementById("cta");

const run = setInterval(()=>{
  t--;
  timer.textContent = t;
  if(t<=0){
    clearInterval(run);
    cta.style.opacity = 1;
  }
},1000);
</script>

</body>
</html>
