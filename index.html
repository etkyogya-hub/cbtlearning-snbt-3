<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>CBTLearning – Visual Hook</title>

<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">

<style>
html,body{
  margin:0;
  height:100%;
  background:#020617;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  font-family:system-ui;
}

/* PHONE MOCKUP */
.phone{
  width:240px;
  height:480px;
  border-radius:36px;
  position:relative;
  background:linear-gradient(160deg,#0f172a,#020617);
  box-shadow:0 40px 120px rgba(0,0,0,.85);
  animation:float 7s ease-in-out infinite;
}
@keyframes float{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-6px)}
}
.phone::before{
  content:"";
  position:absolute;
  inset:-3px;
  border-radius:38px;
  background:linear-gradient(180deg,transparent,rgba(56,189,248,.6),transparent);
  opacity:.5;
}

/* SCREEN */
.screen{
  position:absolute;
  inset:12px;
  border-radius:26px;
  overflow:hidden;
  background:
    radial-gradient(circle at 30% 20%, rgba(56,189,248,.25), transparent 60%),
    radial-gradient(circle at 70% 80%, rgba(129,140,248,.25), transparent 60%),
    linear-gradient(180deg,#020617,#020617);
}

/* FAKE VIDEO BACKGROUND (NOT WHITE) */
.bg{
  position:absolute;
  inset:0;
  background:
    linear-gradient(120deg,rgba(15,23,42,.9),rgba(2,6,23,.9)),
    url("https://images.unsplash.com/photo-1522202176988-66273c2fd55f?w=800");
  background-size:cover;
  background-position:center;
  filter:contrast(1.1) brightness(.8);
  opacity:.9;
}

/* TITLE */
.title-wrap{
  position:absolute;
  bottom:18px;
  width:100%;
  text-align:center;
  pointer-events:none;
}

.title{
  font-family:'Anton',sans-serif;
  font-size:20px;
  letter-spacing:1px;
  position:absolute;
  width:100%;
  left:0;
}

.solid{
  color:#ffffff;
  text-shadow:0 0 14px rgba(255,255,255,.55);
  z-index:3;
}

.ghost{
  z-index:2;
  color:#93c5fd;
  opacity:.45;
  filter:blur(1.2px);
}

.ghost span{
  display:inline-block;
  animation:spirit 2.6s ease-in-out infinite;
}

@keyframes spirit{
  0%{
    transform:translate(0,0) scale(1);
    opacity:.45;
  }
  45%{
    transform:
      translate(
        calc(-14px + 28px * var(--x)),
        calc(-18px + 36px * var(--y))
      )
      scale(1.6);
    opacity:0;
  }
  100%{
    transform:translate(0,0) scale(1);
    opacity:.45;
  }
}

/* DEMO CONTENT (BIAR ADA ISI) */
.demo{
  position:absolute;
  top:60px;
  left:10%;
  width:80%;
  color:#e5e7eb;
  font-size:13px;
  line-height:1.6;
  text-align:center;
  text-shadow:0 0 12px rgba(0,0,0,.6);
}
</style>
</head>

<body>

<div class="phone">
  <div class="screen">
    <div class="bg"></div>

    <div class="demo">
      Jika 3x + 5 = 20<br>
      berapa nilai x?<br><br>
      <strong>CBT bukan hafalan.<br>Ini cara baca.</strong>
    </div>

    <div class="title-wrap">
      <div class="title solid">SNBT – HARD REASONING</div>
      <div class="title ghost" id="ghostTitle">
        SNBT – HARD REASONING
      </div>
    </div>

  </div>
</div>

<script>
const ghost=document.getElementById("ghostTitle");
const text=ghost.innerText;
ghost.innerHTML="";

text.split("").forEach(ch=>{
  const s=document.createElement("span");
  s.textContent = ch === " " ? "\u00A0" : ch;
  s.style.setProperty("--x",Math.random());
  s.style.setProperty("--y",Math.random());
  s.style.animationDelay = (Math.random()*2.2)+"s";
  s.style.animationDuration = (2.4+Math.random()*2.6)+"s";
  ghost.appendChild(s);
});
</script>

</body>
</html>
